💡 Merksatz: Alt+Enter ist dein bester Freund — IntelliJ schlägt für fast jeden Fehler und jede Warnung die richtige Lösung vor. Einfach drücken und auswählen.`,
  "git": `Was ist das?
Git ist ein Versionskontrollsystem — es speichert jeden Zwischenstand deines Codes und ermöglicht das Zurückspringen zu alten Versionen. GitHub ist eine Plattform zum Hosten und Teilen von Git-Repositories.

Warum brauche ich das?
Ohne Git gibt es kein "Rückgängig" bei großen Änderungen, keine sichere Zusammenarbeit im Team und keine Nachvollziehbarkeit was wann von wem geändert wurde.

Git einrichten und erstes Repository:
\\\`\\\`\\\`bash
# Git konfigurieren (einmalig)
git config --global user.name "Max Mustermann"
git config --global user.email "max@example.com"

# Neues Repository anlegen
mkdir mein-projekt
cd mein-projekt
git init              # .git-Ordner wird angelegt

# Status immer als erstes prüfen
git status
# On branch main
# Nothing to commit, working tree clean
\\\`\\\`\\\`

Der tägliche Workflow:
\\\`\\\`\\\`bash
# 1. Dateien bearbeiten (in IDE oder Editor)

# 2. Was hat sich geändert?
git status             # welche Dateien sind geändert?
git diff               # was genau hat sich geändert?

# 3. Änderungen für Commit vorbereiten (stagen)
git add Main.java               # eine Datei
git add src/                    # ganzen Ordner
git add .                       # ALLES (Vorsicht!)
git add -p                      # interaktiv: Änderung für Änderung

# 4. Commit erstellen — Snapshot speichern
git commit -m "feat: Benutzerlogin implementiert"
git commit -m "fix: NullPointerException in UserService behoben"
git commit -m "docs: README aktualisiert"

# 5. Verlauf anschauen
git log --oneline      # kompakte Übersicht
git log --graph        # mit Branch-Visualisierung
\\\`\\\`\\\`

.gitignore — was NICHT ins Repository gehört:
\\\`\\\`\\\`
# .gitignore für Java/IntelliJ

# Kompilierte Dateien
*.class
*.jar

# Maven/Gradle Build-Ordner
target/
build/
.gradle/

# IntelliJ IDEA
.idea/
*.iml

# macOS
.DS_Store

# Windows
Thumbs.db
\\\`\\\`\\\`

Mit GitHub arbeiten:
\\\`\\\`\\\`bash
# Repository von GitHub klonen
git clone https://github.com/username/repo.git

# Verbindung zu GitHub herstellen
git remote add origin https://github.com/username/mein-projekt.git

# Hochladen
git push -u origin main        # erstes Mal
git push                       # danach

# Runterladen (Änderungen anderer)
git pull

# Branch-Workflow (professionell)
git switch -c feature/login    # neuen Branch erstellen und wechseln
# ... Code schreiben ...
git add .
git commit -m "feat: Login fertig"
git push origin feature/login  # Branch hochladen
# → Auf GitHub: Pull Request erstellen → Review → Merge
\\\`\\\`\\\`

Rückgängig machen:
\\\`\\\`\\\`bash
git restore Datei.java         # lokale Änderung verwerfen
git restore --staged Datei.java # aus Stage nehmen (nicht löschen)
git commit --amend             # letzten Commit korrigieren
git revert HEAD                # letzten Commit rückgängig (neuer Commit)
git log --oneline              # Commit-Hash herausfinden
git checkout abc1234 -- Datei.java # alte Version einer Datei wiederherstellen
\\\`\\\`\\\`

Commit-Message Konvention:
\\\`\\\`\\\`
Format: typ: kurze Beschreibung (max 50 Zeichen)

Typen:
  feat:     neues Feature
  fix:      Bug behoben
  docs:     Dokumentation
  refactor: Umstrukturierung ohne Funktionsänderung
  test:     Tests hinzugefügt
  chore:    Hilfstätigkeiten (Dependencies updaten etc.)

Beispiele:
  feat: Benutzerregistrierung implementiert
  fix: Absturz bei leerem Suchbegriff behoben
  refactor: UserService in kleinere Methoden aufgeteilt
\\\`\\\`\\\`

💡 Merksatz: Committe oft, committe früh — viele kleine Commits sind besser als ein riesiger. Der Commit-Message ist für deinen zukünftigen Kollegen (oder dich in 6 Monaten).`,
  "github": `Was ist das?
GitHub ist die größte Plattform für Git-Repositories. Hier hostest du Code, arbeitest im Team, findest Open-Source-Projekte und präsentierst deine Arbeit.

Warum brauche ich das?
GitHub ist der Standard in der Industrie. Jedes professionelle Team nutzt es. Dein GitHub-Profil ist dein Entwickler-Portfolio.

Repository erstellen und verknüpfen:
\\\`\\\`\\\`bash
# 1. Auf github.com: "New repository" klicken
#    Name, Beschreibung, Public/Private wählen
#    README NICHT erstellen wenn lokales Repo schon existiert!

# 2. Lokal verknüpfen
git remote add origin https://github.com/username/repo.git
git branch -M main              # Branch "main" nennen
git push -u origin main         # erstes Hochladen

# Danach immer:
git push                        # Änderungen hochladen
git pull                        # Änderungen runterladen

# Remote-URLs anzeigen/ändern
git remote -v
git remote set-url origin https://github.com/username/neuer-name.git
\\\`\\\`\\\`

Branch-Workflow — professionelle Zusammenarbeit:
\\\`\\\`\\\`bash
# 1. Für jede Aufgabe einen eigenen Branch erstellen
git switch -c feature/benutzer-login
git switch -c fix/datenbankfehler
git switch -c docs/api-dokumentation

# 2. Auf dem Branch entwickeln und committen
git add .
git commit -m "feat: Login-Formular erstellt"

# 3. Branch hochladen
git push origin feature/benutzer-login

# 4. Pull Request auf GitHub erstellen
#    → Code Review durch Kollegen
#    → Kommentare und Verbesserungen
#    → Merge in main wenn fertig

# 5. Lokal aufräumen
git switch main
git pull                     # main aktualisieren
git branch -d feature/benutzer-login  # Branch löschen
\\\`\\\`\\\`

Typische GitHub-Features:
\\\`\\\`\\\`
Issues        → Aufgaben und Bugs tracken
Pull Requests → Code-Änderungen zur Überprüfung einreichen
Actions       → Automatische Tests und Deployments (CI/CD)
Pages         → Statische Websites hosten (für unseren Kurs!)
Releases      → Versionen markieren und veröffentlichen
Fork          → Kopie eines fremden Repos erstellen
Star          → Interessante Repos markieren
\\\`\\\`\\\`

GitHub Actions — automatisch testen:
\\\`\\\`\\\`yaml
# .github/workflows/java.yml
name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: JDK einrichten
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Mit Maven bauen und testen
      run: mvn --batch-mode test
\\\`\\\`\\\`

GitHub Pages für unseren Kurs:
\\\`\\\`\\\`
1. Settings → Pages → Source: Deploy from branch
2. Branch: main, Folder: / (root)
3. Save

→ https://username.github.io/repo-name/
→ Automatisch aktualisiert bei jedem Push!
\\\`\\\`\\\`

Nützliche GitHub-Tastenkürzel:
\\\`\\\`\\\`
T           → Dateisuche im Repository
.           → Repository im Web-Editor öffnen (VS Code im Browser!)
Strg+K      → Befehlspalette
/           → GitHub Copilot (KI-Assistent)
\\\`\\\`\\\`

💡 Merksatz: main ist heilig — direkt auf main pushen ist schlechter Stil. Immer auf einem Feature-Branch entwickeln und via Pull Request mergen.`,
  "maven": `Was ist das?
Maven ist ein Build-Tool und Dependency-Manager für Java. Es standardisiert wie Java-Projekte gebaut, getestet und verpackt werden — und lädt Bibliotheken automatisch herunter.

Warum brauche ich das?
Ohne Maven lädt man JARs manuell herunter und verwaltet den Classpath selbst. Maven macht das automatisch, reproduzierbar und teamweit einheitlich.

Die pom.xml — Herzstück eines Maven-Projekts:
\\\`\\\`\\\`xml
<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
    <modelVersion>4.0.0</modelVersion>

    <!-- Projekt-Koordinaten: identifizieren das Projekt eindeutig -->
    <groupId>de.meinfirma.abteilung</groupId>    <!-- wie ein Java-Paket -->
    <artifactId>mein-projekt</artifactId>          <!-- Projektname -->
    <version>1.0.0-SNAPSHOT</version>             <!-- SNAPSHOT = in Entwicklung -->
    <packaging>jar</packaging>                     <!-- Ausgabeformat -->

    <!-- Java-Version festlegen -->
    <properties>
        <maven.compiler.source>21</maven.compiler.source>
        <maven.compiler.target>21</maven.compiler.target>
        <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
    </properties>

    <!-- Abhängigkeiten — werden automatisch von Maven Central heruntergeladen -->
    <dependencies>
        <!-- JUnit 5 für Tests -->
        <dependency>
            <groupId>org.junit.jupiter</groupId>
            <artifactId>junit-jupiter</artifactId>
            <version>5.10.1</version>
            <scope>test</scope>   <!-- nur für Tests, nicht im finalen JAR -->
        </dependency>

        <!-- Google Guava (nützliche Utilities) -->
        <dependency>
            <groupId>com.google.guava</groupId>
            <artifactId>guava</artifactId>
            <version>33.0.0-jre</version>
            <!-- kein scope = compile, also immer dabei -->
        </dependency>
    </dependencies>
</project>
\\\`\\\`\\\`

Maven-Verzeichnisstruktur (Standard):
\\\`\\\`\\\`
mein-projekt/
├── pom.xml                      ← Maven-Konfiguration
├── src/
│   ├── main/
│   │   ├── java/               ← Produktiv-Code
│   │   │   └── de/meinfirma/
│   │   │       └── App.java
│   │   └── resources/          ← Konfigurationsdateien, Properties
│   │       └── config.properties
│   └── test/
│       ├── java/               ← Test-Code
│       │   └── de/meinfirma/
│       │       └── AppTest.java
│       └── resources/          ← Test-Ressourcen
└── target/                     ← Ausgabe (nicht committen! .gitignore!)
    ├── classes/                 ← Kompilierter Code
    └── mein-projekt-1.0.0.jar  ← Fertiges JAR
\\\`\\\`\\\`

Wichtige Maven-Befehle:
\\\`\\\`\\\`bash
mvn clean              # target/-Ordner löschen
mvn compile            # Quellcode kompilieren
mvn test               # Tests ausführen
mvn package            # JAR/WAR erstellen
mvn install            # ins lokale Maven-Repository installieren
mvn clean install      # alles auf einmal (häufigste Kombination)
mvn dependency:tree    # alle Abhängigkeiten als Baum anzeigen

# In IntelliJ: Maven-Panel rechts → Lifecycle → Doppelklick
\\\`\\\`\\\`

Dependencies auf mvnrepository.com finden:
\\\`\\\`\\\`
1. mvnrepository.com öffnen
2. Bibliothek suchen (z.B. "gson" oder "jackson")
3. Neueste stabile Version wählen
4. Maven-Tab → XML kopieren
5. In pom.xml <dependencies>...</dependencies> einfügen
6. IntelliJ: "Load Maven Changes" klicken (Symbol rechts oben)
\\\`\\\`\\\`

Scope-Typen für Dependencies:
\\\`\\\`\\\`xml
<scope>compile</scope>   <!-- Standard: immer dabei -->
<scope>test</scope>      <!-- nur für Tests: JUnit, Mockito -->
<scope>provided</scope>  <!-- vom Server bereitgestellt: Servlet-API -->
<scope>runtime</scope>   <!-- nur zur Laufzeit: JDBC-Treiber -->
\\\`\\\`\\\`

💡 Merksatz: Dependency auf mvnrepository.com suchen, XML in pom.xml einfügen, Maven lädt sie automatisch. Das lokale Repository liegt in ~/.m2/repository — hier cached Maven alle Downloads.`,
  "gradle": `Was ist das?
Gradle ist ein modernes Build-Tool — flexibler als Maven, mit echter Programmiersprache statt XML, und Standard bei Android-Projekten.

Warum brauche ich das?
Gradle ist schneller als Maven (inkrementeller Build), nutzbarer (Groovy/Kotlin statt XML) und ist der Standard für Android und viele moderne Java-Projekte.

build.gradle — die Konfigurationsdatei:
\\\`\\\`\\\`groovy
// build.gradle (Groovy DSL — echte Programmiersprache!)
plugins {
    id 'java'
    id 'application'    // für ausführbare JARs
}

// Projektinformationen
group   = 'de.meinfirma'
version = '1.0.0'

// Java-Version
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Von wo Dependencies herunterladen
repositories {
    mavenCentral()     // Maven Central Repository
}

// Abhängigkeiten
dependencies {
    // Produktiv-Code
    implementation 'com.google.guava:guava:33.0.0-jre'

    // Nur für Tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Startklasse für ausführbares JAR
application {
    mainClass = 'de.meinfirma.Main'
}

// Tests mit JUnit 5 ausführen
test {
    useJUnitPlatform()
}
\\\`\\\`\\\`

Wichtige Gradle-Befehle:
\\\`\\\`\\\`bash
# Gradle Wrapper — immer verwenden! (garantiert richtige Gradle-Version)
./gradlew build          # kompilieren + testen + JAR erstellen  (Linux/Mac)
gradlew.bat build        # Windows

./gradlew test           # nur Tests ausführen
./gradlew run            # Programm starten
./gradlew clean          # build/-Ordner löschen
./gradlew clean build    # sauber neu bauen
./gradlew dependencies   # alle Dependencies anzeigen
./gradlew tasks          # alle verfügbaren Tasks anzeigen

# In IntelliJ: Gradle-Panel rechts → Tasks
\\\`\\\`\\\`

Gradle vs. Maven — die wichtigsten Unterschiede:
\\\`\\\`\\\`
                Maven           Gradle
Konfiguration:  XML (pom.xml)   Groovy/Kotlin (build.gradle)
Geschwindigkeit: langsamer      schneller (Caching, inkrementell)
Flexibilität:   starr           sehr flexibel (echte Sprache)
Android:        kaum            Standard
Spring Boot:    unterstützt     unterstützt
Lernkurve:      geringer        etwas steiler
\\\`\\\`\\\`

Projektstruktur (identisch zu Maven!):
\\\`\\\`\\\`
mein-projekt/
├── build.gradle          ← Gradle-Konfiguration
├── settings.gradle       ← Projektname
├── gradlew               ← Gradle Wrapper Script (Linux/Mac)
├── gradlew.bat           ← Gradle Wrapper Script (Windows)
├── gradle/wrapper/       ← Wrapper-Einstellungen
└── src/
    ├── main/java/        ← Produktiv-Code (gleich wie Maven)
    └── test/java/        ← Test-Code
\\\`\\\`\\\`

Kotlin DSL (moderner, typsicher):
\\\`\\\`\\\`kotlin
// build.gradle.kts (Kotlin DSL — typsicher mit IDE-Unterstützung)
plugins {
    java
    application
}

dependencies {
    implementation("com.google.guava:guava:33.0.0-jre")
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.1")
}

application {
    mainClass.set("de.meinfirma.Main")
}
\\\`\\\`\\\`

💡 Merksatz: gradlew (Gradle Wrapper) immer statt gradle direkt verwenden — der Wrapper garantiert dass alle Entwickler im Team dieselbe Gradle-Version nutzen.`,
  "debug": `Was ist das?
Debuggen ist das systematische Finden und Beheben von Fehlern. Mit IntelliJ's Debugger kannst du dein Programm Schritt für Schritt durchgehen und Variablenwerte live beobachten.

Warum brauche ich das?
System.out.println() für Debugging ist ein Anti-Pattern. Der Debugger zeigt dir in Sekunden was im Programm wirklich passiert — ohne Code zu verändern.

Breakpoints setzen und Debugger starten:
\\\`\\\`\\\`java
public class BugBeispiel {
    public static void main(String[] args) {
        int[] zahlen = {5, 2, 8, 1, 9};
        int summe = berechne(zahlen);      // ← Breakpoint hier setzen
        System.out.println("Summe: " + summe);
    }

    public static int berechne(int[] arr) {
        int ergebnis = 0;
        for (int i = 0; i <= arr.length; i++) { // Bug: <= statt <
            ergebnis += arr[i];                  // ArrayIndexOutOfBoundsException!
        }
        return ergebnis;
    }
}
\\\`\\\`\\\`

Debugger-Workflow in IntelliJ:
\\\`\\\`\\\`
1. Breakpoint setzen
   → Links neben die Zeilennummer klicken
   → Roter Punkt erscheint ●

2. Debugger starten
   → Shift+F9 (oder grüner Käfer-Button)
   → Programm läuft bis zum Breakpoint und hält an

3. Code schrittweise ausführen
   → F8  "Step Over"  — nächste Zeile, Methoden werden nicht betreten
   → F7  "Step Into"  — in die aufgerufene Methode reinspringen
   → F9  "Resume"     — weiter bis zum nächsten Breakpoint
   → Shift+F8 "Step Out" — aus der aktuellen Methode raus

4. Variablen beobachten
   → Im "Variables"-Panel links: alle aktuellen Werte
   → Über Variable hovern: Wert wird angezeigt
   → Watches: eigene Ausdrücke beobachten (z.B. arr.length, i < arr.length)

5. Bug gefunden!
   → i <= arr.length → i < arr.length  (= Fehler: Index 5 existiert nicht!)
\\\`\\\`\\\`

Verschiedene Breakpoint-Typen:
\\\`\\\`\\\`java
// 1. Normaler Breakpoint — hält immer an (● rot)
int x = berechne();   // ← Breakpoint: Klick links neben Zeile

// 2. Bedingter Breakpoint — hält nur wenn Bedingung true
// Rechtsklick auf Breakpoint → Condition:  i == 4
for (int i = 0; i < 10; i++) {
    verarbeite(i);  // hält nur bei i==4 an
}

// 3. Log-Breakpoint — gibt Wert aus ohne anzuhalten (kein println nötig!)
// Rechtsklick → "Evaluate and log": "i = " + i + ", arr[i] = " + arr[i]
\\\`\\\`\\\`

Ausdrücke auswerten (Evaluate Expression):
\\\`\\\`\\\`
Alt+F8 → "Evaluate Expression" Dialog öffnet sich
→ Beliebige Java-Ausdrücke eingeben und Ergebnis sehen
→ Beispiele:
   arr.length          → 5
   i < arr.length      → false  (Bug gefunden!)
   Arrays.toString(arr) → "[5, 2, 8, 1, 9]"
   arr[i-1]            → 9
\\\`\\\`\\\`

Häufige Fehler und ihre Ursachen:
\\\`\\\`\\\`
NullPointerException
  → Variable ist null, wurde nie initialisiert
  → Debugger: welche Variable ist null?

ArrayIndexOutOfBoundsException
  → Index >= length oder negativ
  → Debugger: i und arr.length beobachten

StackOverflowError
  → Endlose Rekursion ohne Basisfall
  → Debugger: Call Stack anschauen

NumberFormatException
  → Integer.parseInt("abc") — kein gültiger Zahl-String
  → Debugger: welchen Wert hat der String?

ClassCastException
  → (Hund) tierObjekt — Objekt ist keine Hund-Instanz
  → Debugger: instanceof prüfen
\\\`\\\`\\\`

💡 Merksatz: Bevor du System.out.println() zum Debuggen einsetzt — setze einen Breakpoint. Der Debugger zeigt dir in 10 Sekunden was println in 10 Minuten zeigen würde.`,
  "sql-basics": `Was ist das?
SQL (Structured Query Language) ist die Sprache zum Verwalten von Daten in relationalen Datenbanken. Fast jede Unternehmensanwendung speichert Daten in einer Datenbank.

Warum brauche ich das?
Als Java-Entwickler wirst du täglich mit Datenbanken arbeiten. SQL ist die Sprache mit der du Daten abrufst, speicherst und verwaltest.

Relationale Datenbanken — Grundkonzepte:
\\\`\\\`\\\`sql
-- Eine Datenbank besteht aus Tabellen
-- Tabellen haben Spalten (Felder) und Zeilen (Datensätze)

-- Tabelle erstellen
CREATE TABLE kunden (
    id        INT PRIMARY KEY AUTO_INCREMENT,  -- eindeutiger Schlüssel
    vorname   VARCHAR(50)  NOT NULL,           -- Text, max 50 Zeichen
    nachname  VARCHAR(50)  NOT NULL,
    email     VARCHAR(100) UNIQUE,             -- muss eindeutig sein
    alter     INT          CHECK (alter >= 0), -- Validierung
    erstellt  DATE         DEFAULT CURRENT_DATE -- Standardwert
);

-- Tabelle löschen
DROP TABLE kunden;

-- Spalte hinzufügen
ALTER TABLE kunden ADD COLUMN telefon VARCHAR(20);
\\\`\\\`\\\`

CRUD — die vier Grundoperationen:
\\\`\\\`\\\`sql
-- CREATE: Daten einfügen (INSERT)
INSERT INTO kunden (vorname, nachname, email, alter)
VALUES ('Anna', 'Müller', 'anna@example.com', 28);

INSERT INTO kunden (vorname, nachname, email, alter) VALUES
('Ben',   'Schmidt', 'ben@example.com',   25),
('Clara', 'Weber',   'clara@example.com', 32);  -- mehrere auf einmal

-- READ: Daten abfragen (SELECT)
SELECT * FROM kunden;                           -- alle Spalten
SELECT vorname, email FROM kunden;              -- bestimmte Spalten
SELECT * FROM kunden WHERE alter > 25;          -- Bedingung
SELECT * FROM kunden WHERE nachname = 'Müller'; -- genau gleich
SELECT * FROM kunden WHERE vorname LIKE 'A%';   -- beginnt mit A
SELECT * FROM kunden WHERE alter BETWEEN 20 AND 30;
SELECT * FROM kunden ORDER BY nachname ASC;     -- aufsteigend sortieren
SELECT * FROM kunden ORDER BY alter DESC;       -- absteigend
SELECT * FROM kunden LIMIT 10;                  -- nur 10 Ergebnisse
SELECT * FROM kunden LIMIT 10 OFFSET 20;        -- Seite 3 (ab Zeile 21)

-- UPDATE: Daten ändern
UPDATE kunden SET alter = 29 WHERE id = 1;
UPDATE kunden SET email = 'neu@example.com', alter = 30 WHERE vorname = 'Anna';
-- ACHTUNG: Ohne WHERE werden ALLE Zeilen geändert!

-- DELETE: Daten löschen
DELETE FROM kunden WHERE id = 1;
-- ACHTUNG: Ohne WHERE werden ALLE Zeilen gelöscht!
\\\`\\\`\\\`

Aggregationsfunktionen:
\\\`\\\`\\\`sql
SELECT COUNT(*)        FROM kunden;                -- Anzahl Kunden
SELECT COUNT(email)    FROM kunden;                -- Anzahl mit E-Mail
SELECT AVG(alter)      FROM kunden;                -- Durchschnittsalter
SELECT MIN(alter)      FROM kunden;                -- jüngster Kunde
SELECT MAX(alter)      FROM kunden;                -- ältester Kunde
SELECT SUM(bestellwert) FROM bestellungen;         -- Gesamtumsatz

-- Gruppieren
SELECT nachname, COUNT(*) AS anzahl
FROM kunden
GROUP BY nachname
HAVING COUNT(*) > 1;   -- nur Gruppen mit mehr als einem Eintrag

-- Komplexeres Beispiel
SELECT
    YEAR(erstellt)  AS jahr,
    COUNT(*)        AS neue_kunden,
    AVG(alter)      AS durchschnittsalter
FROM kunden
GROUP BY YEAR(erstellt)
ORDER BY jahr DESC;
\\\`\\\`\\\`

Wichtige WHERE-Bedingungen:
\\\`\\\`\\\`sql
WHERE alter = 25           -- genau gleich
WHERE alter != 25          -- ungleich
WHERE alter > 20           -- größer
WHERE alter BETWEEN 20 AND 30  -- im Bereich (inklusiv)
WHERE name LIKE 'A%'       -- beginnt mit A  (% = beliebige Zeichen)
WHERE name LIKE '%er'      -- endet mit er
WHERE name LIKE '%ann%'    -- enthält ann
WHERE email IS NULL        -- kein Wert eingetragen
WHERE email IS NOT NULL    -- Wert vorhanden
WHERE id IN (1, 3, 5)     -- einer dieser Werte
WHERE id NOT IN (2, 4)    -- keiner dieser Werte
WHERE alter > 20 AND nachname = 'Müller'   -- UND
WHERE alter < 18 OR alter > 65             -- ODER
\\\`\\\`\\\`

💡 Merksatz: SELECT lesen, INSERT einfügen, UPDATE ändern, DELETE löschen — das sind die vier CRUD-Operationen. Ohne WHERE in UPDATE und DELETE werden ALLE Zeilen betroffen!`,
  "sql-joins": `Was ist das?
JOINs verbinden Daten aus mehreren Tabellen. Daten werden aufgeteilt gespeichert (Normalisierung) — JOINs fügen sie für Abfragen wieder zusammen.

Warum brauche ich das?
In echten Datenbanken sind Daten auf viele Tabellen verteilt. Bestellungen gehören zu Kunden, Produkte zu Kategorien. Ohne JOINs kann man diese Beziehungen nicht abfragen.

Tabellenbeziehungen — Primär- und Fremdschlüssel:
\\\`\\\`\\\`sql
-- Kunden-Tabelle (Eltern-Tabelle)
CREATE TABLE kunden (
    id       INT PRIMARY KEY AUTO_INCREMENT,
    name     VARCHAR(100) NOT NULL,
    email    VARCHAR(100)
);

-- Bestellungen-Tabelle (Kind-Tabelle)
CREATE TABLE bestellungen (
    id          INT PRIMARY KEY AUTO_INCREMENT,
    kunde_id    INT NOT NULL,
    produkt     VARCHAR(100),
    betrag      DECIMAL(10, 2),
    datum       DATE DEFAULT CURRENT_DATE,
    FOREIGN KEY (kunde_id) REFERENCES kunden(id)  -- Fremdschlüssel
    -- Verhindert: Bestellung zu einem nicht existierenden Kunden
);

-- Testdaten
INSERT INTO kunden VALUES (1, 'Anna', 'anna@test.de'),
                          (2, 'Ben',  'ben@test.de'),
                          (3, 'Clara', null);  -- ohne Bestellung

INSERT INTO bestellungen (kunde_id, produkt, betrag) VALUES
    (1, 'Java-Buch',    39.99),
    (1, 'Tastatur',    89.99),
    (2, 'Monitor',    299.99);
\\\`\\\`\\\`

INNER JOIN — nur Zeilen die in BEIDEN Tabellen einen Match haben:
\\\`\\\`\\\`sql
SELECT k.name, b.produkt, b.betrag
FROM kunden k
INNER JOIN bestellungen b ON k.id = b.kunde_id;

-- Ergebnis:
-- Anna | Java-Buch | 39.99
-- Anna | Tastatur  | 89.99
-- Ben  | Monitor   | 299.99
-- Clara taucht NICHT auf — hat keine Bestellungen!
\\\`\\\`\\\`

LEFT JOIN — ALLE Zeilen der linken Tabelle, auch ohne Match:
\\\`\\\`\\\`sql
SELECT k.name, b.produkt, b.betrag
FROM kunden k
LEFT JOIN bestellungen b ON k.id = b.kunde_id;

-- Ergebnis:
-- Anna  | Java-Buch | 39.99
-- Anna  | Tastatur  | 89.99
-- Ben   | Monitor   | 299.99
-- Clara | NULL      | NULL    ← Clara ist dabei, aber ohne Bestellung
\\\`\\\`\\\`

Aggregation mit JOIN:
\\\`\\\`\\\`sql
-- Wie viele Bestellungen hat jeder Kunde? Gesamtumsatz?
SELECT
    k.name,
    COUNT(b.id)    AS anzahl_bestellungen,
    COALESCE(SUM(b.betrag), 0) AS gesamtumsatz   -- COALESCE: null → 0
FROM kunden k
LEFT JOIN bestellungen b ON k.id = b.kunde_id
GROUP BY k.id, k.name
ORDER BY gesamtumsatz DESC;

-- Ergebnis:
-- Anna  | 2 | 129.98
-- Ben   | 1 | 299.99
-- Clara | 0 | 0.00
\\\`\\\`\\\`

Drei Tabellen verbinden:
\\\`\\\`\\\`sql
CREATE TABLE produkte (
    id       INT PRIMARY KEY,
    name     VARCHAR(100),
    kategorie VARCHAR(50)
);

CREATE TABLE bestellpositionen (
    id           INT PRIMARY KEY AUTO_INCREMENT,
    bestellung_id INT REFERENCES bestellungen(id),
    produkt_id    INT REFERENCES produkte(id),
    menge         INT,
    preis         DECIMAL(10,2)
);

-- Komplexer JOIN über drei Tabellen
SELECT k.name AS kunde, p.name AS produkt, bp.menge, bp.preis
FROM kunden k
JOIN bestellungen b   ON k.id = b.id
JOIN bestellpositionen bp ON b.id = bp.bestellung_id
JOIN produkte p       ON bp.produkt_id = p.id
WHERE k.id = 1;
\\\`\\\`\\\`

💡 Merksatz: INNER JOIN = Schnittmenge (nur Matches), LEFT JOIN = alle Links + Matches rechts (NULL wenn kein Match). Tabellenaliase (k, b) machen JOINs lesbarer.`,
  "jdbc": `Was ist das?
JDBC (Java Database Connectivity) ist die Standard-API mit der Java-Programme mit Datenbanken kommunizieren. Es ist die Brücke zwischen Java-Code und SQL-Datenbanken.

Warum brauche ich das?
Ohne JDBC kann Java nicht mit einer Datenbank sprechen. JDBC ist das Fundament — auch wenn man später JPA oder Spring Data nutzt, läuft alles über JDBC.

JDBC-Verbindung aufbauen:
\\\`\\\`\\\`java
import java.sql.*;

// JDBC-URL Formate:
// MySQL:      jdbc:mysql://localhost:3306/datenbankname
// PostgreSQL: jdbc:postgresql://localhost:5432/datenbankname
// H2 (Test):  jdbc:h2:mem:testdb  (In-Memory, kein Server nötig!)
// H2 (Datei): jdbc:h2:./meine-datenbank

// Verbindung aufbauen
String url  = "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1";
String user = "sa";
String pass = "";

try (Connection conn = DriverManager.getConnection(url, user, pass)) {
    System.out.println("Verbunden! DB: " + conn.getCatalog());
    // ... Datenbankoperationen
} catch (SQLException e) {
    System.err.println("Verbindungsfehler: " + e.getMessage());
}
// try-with-resources schließt conn automatisch!
\\\`\\\`\\\`

\\\`\\\`\\\`java
try (Connection conn = DriverManager.getConnection(url, user, pass)) {

    // Tabelle erstellen
    try (Statement stmt = conn.createStatement()) {
        stmt.execute(
            "CREATE TABLE IF NOT EXISTS kunden (" +
            "id INT PRIMARY KEY AUTO_INCREMENT," +
            "name VARCHAR(100) NOT NULL," +
            "email VARCHAR(100)," +
            "alter INT)");
    }

    // PreparedStatement — IMMER für Daten mit Variablen verwenden!
    // Verhindert SQL-Injection, ist performanter bei Wiederholung
    String sql = "INSERT INTO kunden (name, email, alter) VALUES (?, ?, ?)";
    try (PreparedStatement ps = conn.prepareStatement(sql)) {

        ps.setString(1, "Anna Müller");
        ps.setString(2, "anna@example.com");
        ps.setInt(3, 28);
        int betroffeneZeilen = ps.executeUpdate();
        System.out.println("Eingefügt: " + betroffeneZeilen + " Zeile(n)");

        // Mehrere Zeilen einfügen
        String[][] daten = {{"Ben", "ben@test.de", "25"}, {"Clara", "clara@test.de", "32"}};
        for (String[] d : daten) {
            ps.setString(1, d[0]);
            ps.setString(2, d[1]);
            ps.setInt(3, Integer.parseInt(d[2]));
            ps.executeUpdate();
        }
    }
}

Vollständiges CRUD-Beispiel:
\\\`\\\`\\\`java
public class KundenRepository {
    private final Connection conn;

    public KundenRepository(Connection conn) { this.conn = conn; }

    public void erstellen(String name, String email) throws SQLException {
        try (var ps = conn.prepareStatement("INSERT INTO kunden(name,email) VALUES(?,?)")) {
            ps.setString(1, name); ps.setString(2, email);
            ps.executeUpdate();
        }
    }

    public List<String> alleNamen() throws SQLException {
        List<String> namen = new ArrayList<>();
        try (var rs = conn.createStatement().executeQuery("SELECT name FROM kunden")) {
            while (rs.next()) namen.add(rs.getString("name"));
        }
        return namen;
    }

    public void loeschen(int id) throws SQLException {
        try (var ps = conn.prepareStatement("DELETE FROM kunden WHERE id=?")) {
            ps.setInt(1, id); ps.executeUpdate();
        }
    }
}

  "jpa": `Was ist das?
JPA (Java Persistence API) ist ein Standard für ORM (Object-Relational Mapping). Hibernate ist die bekannteste Implementierung. Statt SQL schreibst du Java-Klassen — JPA übersetzt sie automatisch in Datenbanktabellen.

Warum brauche ich das?
ORM eliminiert das manuelle Schreiben von CRUD-SQL. Du arbeitest mit Java-Objekten, nicht mit SQL-Strings — das ist produktiver und weniger fehleranfällig.

Entity — Java-Klasse als Datenbanktabelle:
\\\`\\\`\\\`java
import jakarta.persistence.*;
import java.time.LocalDate;

@Entity                        // Diese Klasse ist eine DB-Tabelle
@Table(name = "kunden")        // Tabellenname (optional, Default = Klassenname)
public class Kunde {

    @Id                        // Primärschlüssel
    @GeneratedValue(strategy = GenerationType.IDENTITY)  // AUTO_INCREMENT
    private Long id;

    @Column(name = "vorname", nullable = false, length = 50)
    private String vorname;

    @Column(nullable = false)
    private String nachname;   // Spaltenname = Feldname (lowercase)

    @Column(unique = true)
    private String email;

    private int alter;         // automatisch als Spalte erkannt

    @Column(name = "erstellt")
    private LocalDate erstellt = LocalDate.now();

    // JPA braucht einen No-Args-Konstruktor!
    public Kunde() {}

    public Kunde(String vorname, String nachname, String email) {
        this.vorname   = vorname;
        this.nachname  = nachname;
        this.email     = email;
    }

    // Getter und Setter...
    public Long getId()          { return id; }
    public String getVorname()   { return vorname; }
    public void setVorname(String v) { this.vorname = v; }
    // ... etc.

    @Override
    public String toString() {
        return "Kunde[" + id + ": " + vorname + " " + nachname + "]";
    }
}

public interface KundenRepository extends JpaRepository<Kunde, Long> {

    public List<Kunde> alleFinden() { return repo.findAll(); }

    public Optional<Kunde> findeNachId(Long id) { return repo.findById(id); }

}

  "spring-core": `Was ist das?
Spring Framework ist das meistgenutzte Java-Framework. Sein Kernkonzept ist Dependency Injection (DI) — Objekte werden nicht selbst erstellt, sondern vom Framework bereitgestellt.

Warum brauche ich das?
DI macht Code lose gekoppelt (leicht austauschbar), testbar (Abhängigkeiten durch Mocks ersetzbar) und übersichtlich (kein new überall im Code).

Das Problem ohne DI:
\\\`\\\`\\\`java
// OHNE Spring — enge Kopplung, schwer testbar
public class BestellService {
    // Direkt instanziiert — nicht austauschbar!
    private EmailService emailService = new EmailService();
    private KundenRepository repo = new KundenRepository("jdbc:mysql://...");

    public void bestellen(Kunde k, String produkt) {
        // ... Logik
        emailService.sende(k.getEmail(), "Bestellung erhalten");
    }
}
// Problem: EmailService kann nicht durch Mock ersetzt werden!
// Problem: KundenRepository ist an MySQL gebunden!
\\\`\\\`\\\`

Die Lösung — Dependency Injection mit Spring:
\\\`\\\`\\\`java
// MIT Spring — lose Kopplung, vollständig testbar
@Service   // Spring weiß: das ist eine Bean, verwalte sie!
public class BestellService {

    private final EmailService emailService;
    private final KundenRepository repo;

    // Konstruktor-Injection — empfohlen!
    // Spring injiziert die Abhängigkeiten automatisch
    public BestellService(EmailService emailService, KundenRepository repo) {
        this.emailService = emailService;
        this.repo         = repo;
    }

    public void bestellen(Long kundeId, String produkt) {
        Kunde kunde = repo.findById(kundeId).orElseThrow();
        // ... Logik
        emailService.sende(kunde.getEmail(), "Bestellung erhalten: " + produkt);
    }
}

@Service
public class EmailService {
    public void sende(String an, String betreff) {
        System.out.println("E-Mail an " + an + ": " + betreff);
    }
}

@Repository   // Datenbankzugriff-Bean
public class KundenRepository { ... }

Injection-Arten — welche ist wann empfohlen?
\\\`\\\`\\\`java
// 1. Konstruktor-Injection (EMPFOHLEN)
@Service
public class MeinService {
    private final AbhaengigkeitA a;
    private final AbhaengigkeitB b;

    public MeinService(AbhaengigkeitA a, AbhaengigkeitB b) {
        this.a = a; this.b = b;
    }
}
// Vorteile: final (immutable), sofort testbar ohne Spring, Zyklus-Erkennung

// 2. Feld-Injection (NICHT empfohlen, aber verbreitet)
@Service
public class MeinService {
    @Autowired AbhaengigkeitA a;  // ✗ nicht testbar ohne Spring-Context
    @Autowired AbhaengigkeitB b;
}

// 3. Setter-Injection (für optionale Abhängigkeiten)
@Service
public class MeinService {
    private AbhaengigkeitA a;
    @Autowired
    public void setA(AbhaengigkeitA a) { this.a = a; }
}

  "rest-api": `Was ist das?
REST (Representational State Transfer) ist ein Architekturstil für Web-APIs. Ressourcen (Kunden, Produkte) werden über HTTP-Methoden (GET, POST, PUT, DELETE) verwaltet.

Warum brauche ich das?
REST APIs sind der Standard für Kommunikation zwischen Frontend und Backend, zwischen Microservices und für mobile Apps. Jeder Java-Backend-Entwickler muss REST APIs bauen können.

HTTP-Methoden und ihre Bedeutung:
\\\`\\\`\\\`
GET    /kunden          → alle Kunden abrufen       (200 OK)
GET    /kunden/42       → Kunde 42 abrufen           (200 OK oder 404)
POST   /kunden          → neuen Kunden anlegen       (201 Created)
PUT    /kunden/42       → Kunde 42 komplett ersetzen (200 OK oder 404)
PATCH  /kunden/42       → Kunde 42 teilweise ändern  (200 OK oder 404)
DELETE /kunden/42       → Kunde 42 löschen           (204 No Content oder 404)
\\\`\\\`\\\`

Vollständiger REST Controller:
\\\`\\\`\\\`java
import org.springframework.web.bind.annotation.*;
import org.springframework.http.*;

@RestController                    // = @Controller + @ResponseBody
@RequestMapping("/api/kunden")     // Basis-URL für alle Methoden
public class KundenController {

    private final KundenService service;

    public KundenController(KundenService service) {
        this.service = service;
    }

    // GET /api/kunden → alle Kunden
    @GetMapping
    public List<Kunde> alleKunden() {
        return service.findAll();  // wird automatisch zu JSON konvertiert
    }

    // GET /api/kunden/42 → Kunde 42
    @GetMapping("/{id}")
    public ResponseEntity<Kunde> kundeById(@PathVariable Long id) {
        return service.findById(id)
            .map(ResponseEntity::ok)                   // 200 OK
            .orElse(ResponseEntity.notFound().build()); // 404 Not Found
    }

    // GET /api/kunden?name=Anna → Suche
    @GetMapping("/suche")
    public List<Kunde> suche(@RequestParam String name) {
        return service.findByName(name);
    }

    // POST /api/kunden → neuen Kunden anlegen
    @PostMapping
    public ResponseEntity<Kunde> erstellen(@RequestBody KundeDto dto) {
        Kunde gespeichert = service.erstellen(dto);
        URI location = URI.create("/api/kunden/" + gespeichert.getId());
        return ResponseEntity.created(location).body(gespeichert); // 201 Created
    }

    // PUT /api/kunden/42 → Kunde 42 aktualisieren
    @PutMapping("/{id}")
    public ResponseEntity<Kunde> aktualisieren(
            @PathVariable Long id,
            @RequestBody KundeDto dto) {
        return service.aktualisieren(id, dto)
            .map(ResponseEntity::ok)
            .orElse(ResponseEntity.notFound().build());
    }

    // DELETE /api/kunden/42 → Kunde 42 löschen
    @DeleteMapping("/{id}")
    public ResponseEntity<Void> loeschen(@PathVariable Long id) {
        service.loeschen(id);
        return ResponseEntity.noContent().build(); // 204 No Content
    }
}

2xx Erfolg:

  404 Not Found     → Ressource nicht gefunden

  "spring-data": `Was ist das?
Spring Data JPA bietet Repository-Interfaces die CRUD-Methoden und Query-Generierung automatisch implementieren — kein SQL, kein EntityManager, keine Implementierung nötig.

Warum brauche ich das?
Ohne Spring Data schreibt man für jede Entity viele Zeilen Boilerplate-Code. Spring Data macht das in einer Zeile Interface-Deklaration.

Das Repository-Interface:
\\\`\\\`\\\`java
import org.springframework.data.jpa.repository.*;
import org.springframework.stereotype.Repository;
import java.util.List;

@Repository  // optional — JpaRepository-Unterinterfaces werden automatisch erkannt
public interface KundenRepository extends JpaRepository<Kunde, Long> {
    // JpaRepository<Entity, ID-Typ> gibt dir sofort:
    //   save(entity)         → INSERT oder UPDATE
    //   findById(id)         → Optional<Kunde>
    //   findAll()            → List<Kunde>
    //   findAllById(ids)     → List<Kunde>
    //   delete(entity)       → DELETE
    //   deleteById(id)       → DELETE by ID
    //   count()              → SELECT COUNT(*)
    //   existsById(id)       → SELECT EXISTS(...)

    // Abgeleitete Queries — Spring generiert SQL aus dem Methodennamen!
    List<Kunde> findByNachname(String nachname);
    List<Kunde> findByVornameAndNachname(String vorname, String nachname);
    List<Kunde> findByAlterGreaterThan(int alter);
    List<Kunde> findByAlterBetween(int min, int max);
    List<Kunde> findByEmailContaining(String teil);
    List<Kunde> findByVornameContainingIgnoreCase(String suche);
    List<Kunde> findByNachnameOrderByVornameAsc(String name);
    Optional<Kunde> findByEmail(String email);
    boolean existsByEmail(String email);
    long countByAlterGreaterThan(int alter);
    void deleteByEmail(String email);
}
\\\`\\\`\\\`

Eigene JPQL-Abfragen mit @Query:
\\\`\\\`\\\`java
public interface KundenRepository extends JpaRepository<Kunde, Long> {

    // JPQL (Java Persistence Query Language) — objektbasiert
    @Query("SELECT k FROM Kunde k WHERE k.vorname LIKE %:name% OR k.nachname LIKE %:name%")
    List<Kunde> volltextSuche(@Param("name") String name);

    @Query("SELECT k FROM Kunde k WHERE k.alter > :minAlter ORDER BY k.nachname")
    List<Kunde> findeErwachsene(@Param("minAlter") int minAlter);

    @Query("SELECT COUNT(k) FROM Kunde k WHERE k.nachname = :name")
    long zaehleNachNachname(@Param("name") String name);

    // Natives SQL (wenn JPQL nicht reicht)
    @Query(value = "SELECT * FROM kunden WHERE alter > :alter LIMIT :anzahl",
           nativeQuery = true)
    List<Kunde> findeJuengsteKunden(@Param("alter") int alter, @Param("anzahl") int anzahl);

    // Modifying: UPDATE oder DELETE mit @Query
    @Modifying
    @Transactional
    @Query("UPDATE Kunde k SET k.email = :email WHERE k.id = :id")
    int aktualisiereEmail(@Param("id") Long id, @Param("email") String email);

Service-Schicht mit @Transactional:
\\\`\\\`\\\`java
@Service
public class KundenService {
    private final KundenRepository repo;

    public KundenService(KundenRepository repo) { this.repo = repo; }

    // @Transactional: alle DB-Operationen in einer Transaktion
    // Bei Exception → automatischer Rollback!
    @Transactional
    public Kunde erstellen(String vorname, String nachname, String email) {
        if (repo.existsByEmail(email)) {
            throw new IllegalArgumentException("E-Mail bereits vergeben: " + email);
        }
        return repo.save(new Kunde(vorname, nachname, email));
    }

    public List<Kunde> alleKunden() {
        return repo.findAll();
    }

    public Optional<Kunde> findeById(Long id) {
        return repo.findById(id);
    }

    @Transactional
    public Kunde aktualisiere(Long id, String neueEmail) {
        Kunde kunde = repo.findById(id)
            .orElseThrow(() -> new NoSuchElementException("Kunde nicht gefunden: " + id));
        kunde.setEmail(neueEmail);
        return repo.save(kunde);  // UPDATE wird ausgeführt
    }

    @Transactional
    public void loeschen(Long id) {
        if (!repo.existsById(id)) throw new NoSuchElementException("Kunde: " + id);
        repo.deleteById(id);
    }
}

  "junit": `Was ist das?
JUnit 5 ist das Standard-Framework für Unit-Tests in Java. Tests prüfen automatisch ob dein Code richtig funktioniert — bei jeder Änderung.

Warum brauche ich das?
Tests geben dir Sicherheit. Du kannst Code ändern und sofort prüfen ob noch alles funktioniert. Professionelle Entwicklung ohne Tests ist undenkbar.

Aufbau einer Testklasse:
\\\`\\\`\\\`java
import org.junit.jupiter.api.*;
import static org.junit.jupiter.api.Assertions.*;

@DisplayName("Tests für die Rechner-Klasse")
class RechnerTest {

    private Rechner rechner;  // zu testende Klasse

    @BeforeAll   // einmalig BEVOR alle Tests — muss static sein
    static void globalSetup() {
        System.out.println("=== Teste Rechner ===");
    }

    @BeforeEach  // vor JEDEM einzelnen Test
    void setUp() {
        rechner = new Rechner();  // frisches Objekt für jeden Test!
    }

    @AfterEach   // nach JEDEM Test
    void tearDown() {
        // aufräumen (Datenbankverbindungen schließen etc.)
    }

    @AfterAll    // einmalig NACHDEM alle Tests — static
    static void globalTearDown() {
        System.out.println("=== Fertig ===");
    }
}

@Test
@DisplayName("Addition: 3 + 4 soll 7 ergeben")
void testAddition() {
    int ergebnis = rechner.addiere(3, 4);

    // Gleichheit
    assertEquals(7, ergebnis);
    assertEquals(7, ergebnis, "Fehlermeldung wenn Test schlägt fehl");
    assertNotEquals(8, ergebnis);

    // Boolean
    assertTrue(rechner.istPositiv(5));
    assertFalse(rechner.istPositiv(-1));

    // Null-Prüfungen
    assertNotNull(rechner);
    assertNull(rechner.getLetzteBerechnung());

    // Alle auf einmal prüfen (alle werden ausgeführt, nicht abgebrochen bei Fehler)
    assertAll("alle Additionen",
        () -> assertEquals(0,  rechner.addiere(0, 0)),
        () -> assertEquals(0,  rechner.addiere(-5, 5)),
        () -> assertEquals(-3, rechner.addiere(-1, -2))
    );
}

@Test
@DisplayName("Division durch 0 soll Exception werfen")
void testDivisionDurchNull() {

        ArithmeticException.class,
        () -> rechner.dividiere(10, 0)
    );
    assertEquals("Division durch 0!", ex.getMessage());

    // Kein Fehler erwartet

  "mockito": `Was ist das?
Mockito erstellt "gefälschte" Objekte (Mocks) für Abhängigkeiten, damit du eine Klasse isoliert testen kannst — ohne echte Datenbank, E-Mail oder externe APIs.

Warum brauche ich das?
Echte Abhängigkeiten machen Tests langsam, fragil und schwer wartbar. Mit Mocks ersetzt du sie durch kontrollierbare Fälschungen.

    @InjectMocks                   // echtes Objekt — Mocks werden injiziert
    BestellService service;        // das ist was wir testen wollen

  "tdd": `Was ist das?
TDD (Test Driven Development) bedeutet: erst den Test schreiben, dann den Code. Red → Green → Refactor ist der Rhythmus.

Warum brauche ich das?
TDD führt zu besserem Design (testbarer Code ist saubererer Code), vollständiger Testabdeckung und schnellerem Debuggen.

Der Red-Green-Refactor-Zyklus:
\\\`\\\`\\\`
🔴 RED:     Test schreiben der FEHLSCHLÄGT (Klasse existiert noch nicht)
🟢 GREEN:   MINIMALEN Code schreiben damit der Test besteht
🔵 REFACTOR: Code verbessern ohne Tests zu brechen
→ Nächster Test (Red) ...
\\\`\\\`\\\`

TDD Schritt für Schritt — Taschenrechner entwickeln:
\\\`\\\`\\\`java
// SCHRITT 1: 🔴 RED — erster Test (Klasse Rechner existiert noch nicht)
class RechnerTest {
    @Test
    void addiere_zweiPositiveZahlen_gibtSummeZurueck() {
        Rechner r = new Rechner();   // ✗ Compilerfehler! Klasse fehlt!
        assertEquals(7, r.addiere(3, 4));
    }
}

// SCHRITT 2: 🟢 GREEN — minimaler Code zum Bestehen
public class Rechner {
    public int addiere(int a, int b) {
        return a + b;   // minimal, aber reicht für den Test
    }
}
// Test besteht!

// SCHRITT 3: 🔵 REFACTOR — Code prüfen (schon sauber genug)

// SCHRITT 4: 🔴 RED — nächster Test
@Test
void addiere_negativZahl_gibtRichtigesErgebnis() {
    assertEquals(-1, rechner.addiere(3, -4));   // noch kein Problem
}
@Test
void addiere_beideMalNull_gibtNull() {
    assertEquals(0, rechner.addiere(0, 0));
}

// GREEN: addiere() funktioniert bereits für alle Fälle
\\\`\\\`\\\`

Komplexeres TDD-Beispiel — Passwort-Validator:
\\\`\\\`\\\`java
// RED 1: Mindestlänge
@Test void passwortZuKurz_gibtFehler() {
    assertFalse(validator.istGueltig("abc"));
}
// GREEN: public boolean istGueltig(String pw) { return pw.length() >= 8; }

// RED 2: Großbuchstabe erforderlich
@Test void passwortOhneGrossbuchstabe_gibtFehler() {
    assertFalse(validator.istGueltig("abcdefgh"));
}
// GREEN: ergänzen: && pw.chars().anyMatch(Character::isUpperCase)

// RED 3: Zahl erforderlich
@Test void passwortOhneZahl_gibtFehler() {
    assertFalse(validator.istGueltig("Abcdefgh"));
}
// GREEN: ergänzen: && pw.chars().anyMatch(Character::isDigit)

// RED 4: Sonderzeichen
@Test void passwortOhneSonderzeichen_gibtFehler() {
    assertFalse(validator.istGueltig("Abcdefg1"));
}
// GREEN: ergänzen: Sonderzeichen-Check

// RED 5: gültiges Passwort
@Test void gueltiges_passwort_gibtTrue() {
    assertTrue(validator.istGueltig("Abcdefg1!"));
}
// GREEN: bereits erfüllt durch bisherige Implementierung

// REFACTOR: Implementierung aufräumen
public boolean istGueltig(String pw) {
    return pw != null
        && pw.length() >= 8
        && pw.chars().anyMatch(Character::isUpperCase)
        && pw.chars().anyMatch(Character::isDigit)
        && pw.chars().anyMatch(c -> "!@#$%^&*".indexOf(c) >= 0);
}

TDD-Vorteile im Überblick:
\\\`\\\`\\\`
✓ 100% Testabdeckung — du testest immer zuerst
✓ Besseres Design — testbarer Code ist fast immer saubererer Code
✓ Sicheres Refactoring — Tests als Sicherheitsnetz
✓ Klare Anforderungen — Test beschreibt genau was die Methode tun soll
✓ Schnelleres Debuggen — Fehler werden sofort beim Schreiben gefunden
✗ Anfangs langsamer — man muss es erst üben
✗ Schwer für UIs und Integrationen
\\\`\\\`\\\`

💡 Merksatz: Red → Green → Refactor. Erst der Test, dann der Code. Minimale Implementierung für grünen Test, dann refactorn. Wer TDD übt, schreibt nach 2 Wochen automatisch besseren Code.`,
  "cleancode": `Was ist das?
Clean Code ist Code der klar, verständlich und wartbar ist — für andere Entwickler und für dich selbst in sechs Monaten. Robert C. Martin's Buch "Clean Code" ist das Standardwerk.

Warum brauche ich das?
Code wird 10x häufiger gelesen als geschrieben. Unlesbarer Code kostet das Team täglich Stunden. Clean Code ist kein Luxus — es ist Professionalität.

Aussagekräftige Namen — der wichtigste Grundsatz:
\\\`\\\`\\\`java
// ✗ SCHLECHT — was bedeutet das?
public int calc(int x, int y, int t) {
    return x * y * t;
}
int d = calc(10, 5, 3);

// ✓ GUT — sofort verständlich
public double berechneGesamtpreis(int anzahl, double einzelpreis, double steuersatz) {
    return anzahl * einzelpreis * (1 + steuersatz);
}
double gesamtpreis = berechneGesamtpreis(10, 5.0, 0.19);

// ✗ SCHLECHT — nichtssagende Namen
int d;        // vergangene Tage?
boolean flag; // was für ein Flag?
List list;    // Liste von was?

// ✓ GUT — Namen sind Dokumentation
int vergangenerTageSeitAnmeldung;
boolean istEmailBestätigt;
List<Bestellung> offeneBestellungen;
\\\`\\\`\\\`

Methoden kurz halten — Single Responsibility:
\\\`\\\`\\\`java
// ✗ SCHLECHT — eine Methode macht alles (50+ Zeilen)
public void verarbeiteBestellung(Bestellung b) {
    // Validierung...
    // Rabatt berechnen...
    // Steuer berechnen...
    // E-Mail senden...
    // Datenbank speichern...
    // Rechnung drucken...
}

// ✓ GUT — jede Methode hat eine Aufgabe
public void verarbeiteBestellung(Bestellung b) {
    validiereBestellung(b);
    double nettopreis = berechneNettopreis(b);
    double gesamtpreis = berechneGesamtpreis(nettopreis, b.getKunde());
    bestellungSpeichern(b, gesamtpreis);
    bestätigungsEmailSenden(b);
}

// Faustregel: Methode soll auf einen Bildschirm passen (max 20 Zeilen)
\\\`\\\`\\\`

Keine magischen Zahlen:
\\\`\\\`\\\`java
// ✗ SCHLECHT — was bedeuten diese Zahlen?
if (alter >= 18 && punkte >= 100 && wartezeit <= 30) {
    preis = preis * 0.85;
}

// ✓ GUT — Konstanten mit Namen
private static final int MINDESTALTER_ERWACHSEN = 18;
private static final int MINDESTPUNKTE_RABATT   = 100;
private static final int MAX_WARTEZEIT_MINUTEN  = 30;
private static final double TREUERABATT          = 0.15;

if (alter >= MINDESTALTER_ERWACHSEN
    && punkte >= MINDESTPUNKTE_RABATT
    && wartezeit <= MAX_WARTEZEIT_MINUTEN) {
    preis = preis * (1 - TREUERABATT);
}
\\\`\\\`\\\`

DRY — Don't Repeat Yourself:
\\\`\\\`\\\`java
// ✗ SCHLECHT — gleiche Logik dreimal
double preisA = grundpreis * 1.19;
double steuerA = grundpreis * 0.19;

double preisB = rabattpreis * 1.19;
double steuerB = rabattpreis * 0.19;

// ✓ GUT — einmal extrahieren
private static final double MWST = 0.19;

double berechneNetto(double brutto)  { return brutto / (1 + MWST); }
double berechneSteuer(double brutto) { return brutto * MWST / (1 + MWST); }
\\\`\\\`\\\`

Kommentare — weniger ist mehr:
\\\`\\\`\\\`java
// ✗ SCHLECHT — Kommentar erklärt WAS, aber Code tut das auch schon
// Erhöhe i um 1
i++;

// ✗ SCHLECHT — veralteter Kommentar (Code wurde geändert, Kommentar nicht)
// Prüft ob Alter >= 18
if (alter >= 21) { ... }

// ✓ GUT — Kommentar erklärt WARUM (nicht offensichtlich)

  "solid": `Was ist das?
SOLID sind fünf Prinzipien für objektorientiertes Design. Sie beschreiben wie man Klassen strukturiert damit Code wartbar, erweiterbar und testbar bleibt.

Warum brauche ich das?
Ohne Designprinzipien entsteht "Spaghetti-Code" — schwer zu verstehen, ändern und testen. SOLID verhindert das systematisch.

S — Single Responsibility Principle:
\\\`\\\`\\\`java
// ✗ VERLETZUNG — Klasse hat zu viele Aufgaben
public class Benutzer {
    public void speichern()     { /* DB-Zugriff */ }
    public void validieren()    { /* Validierung */ }
    public void emailSenden()   { /* E-Mail */ }
    public void pdFErstellen()  { /* PDF */ }
    // Wenn sich DB ändert, Validierung ändert ODER E-Mail ändert → Klasse ändern!
}

// ✓ RICHTIG — jede Klasse eine Aufgabe
public class BenutzerRepository { public void speichern(Benutzer b) { } }
public class BenutzerValidator  { public void validieren(Benutzer b) { } }
public class EmailService       { public void bestaetigung(Benutzer b) { } }
public class PdfService         { public byte[] erstellePdf(Benutzer b) { } }
\\\`\\\`\\\`

O — Open/Closed Principle:
\\\`\\\`\\\`java
// ✗ VERLETZUNG — für neue Rabattart muss Klasse geändert werden
public class RabattRechner {
    public double berechne(Bestellung b) {
        if (b.getKundenTyp().equals("PREMIUM")) return b.getBetrag() * 0.9;
        if (b.getKundenTyp().equals("STUDENT")) return b.getBetrag() * 0.85;
        // Neue Rabattart = diese Klasse ändern!
        return b.getBetrag();
    }
}

// ✓ RICHTIG — offen für Erweiterung, geschlossen für Änderung
public interface RabattStrategie {
    double berechne(double betrag);
}
public class PremiumRabatt implements RabattStrategie {
    public double berechne(double b) { return b * 0.9; }
}
public class StudentRabatt implements RabattStrategie {
    public double berechne(double b) { return b * 0.85; }
}
// Neue Rabattart: neue Klasse, KEINE Änderung am Bestehenden
\\\`\\\`\\\`

L — Liskov Substitution Principle:
\\\`\\\`\\\`java
// ✗ VERLETZUNG — Unterklasse verhält sich anders als Oberklasse verspricht
public class Rechteck {
    protected int breite, hoehe;
    public void setBreite(int b) { this.breite = b; }
    public void setHoehe(int h) { this.hoehe = h; }
    public int flaeche()        { return breite * hoehe; }
}
public class Quadrat extends Rechteck {
    @Override
    public void setBreite(int b) { this.breite = b; this.hoehe = b; } // Seiten müssen gleich sein!
}
// Wenn Code Rechteck erwartet und Quadrat bekommt → falsches Verhalten!

// ✓ RICHTIG — gemeinsame Abstraktion
public abstract class Form { public abstract int flaeche(); }
public class Rechteck extends Form { ... }
public class Quadrat  extends Form { ... }
\\\`\\\`\\\`

I — Interface Segregation Principle:
\\\`\\\`\\\`java
// ✗ VERLETZUNG — zu großes Interface
public interface Maschine {
    void drucken();
    void scannen();
    void faxen();
    void kopieren();
}
// Einfacher Drucker MUSS scannen/faxen implementieren — macht keinen Sinn!

// ✓ RICHTIG — kleine, spezifische Interfaces
public interface Druckbar  { void drucken(); }
public interface Scanbar   { void scannen(); }
public interface Faxbar    { void faxen(); }

public class SimplerDrucker implements Druckbar { void drucken() { } }
public class AllInOne implements Druckbar, Scanbar, Faxbar { ... }

D — Dependency Inversion Principle:
\\\`\\\`\\\`java
// ✗ VERLETZUNG — abhängig von konkreter Implementierung
public class BestellService {
    private MySQLKundenRepository repo = new MySQLKundenRepository(); // konkret!
    // Test mit H2? Unmöglich ohne Klasse zu ändern!
}

// ✓ RICHTIG — abhängig von Abstraktion (Interface)
public class BestellService {
    private final KundenRepository repo; // Interface!

    public BestellService(KundenRepository repo) { this.repo = repo; }
    // Jetzt kann man MySqlRepo, H2Repo oder MockRepo injizieren!
}
public interface KundenRepository { Optional<Kunde> findById(Long id); }
public class MySQLKundenRepository implements KundenRepository { ... }
public class InMemoryKundenRepository implements KundenRepository { ... } // für Tests

💡 Merksatz: S=eine Aufgabe, O=erweitern statt ändern, L=Unterklasse ersetzt Elternklasse, I=kleine Interfaces, D=von Abstraktionen abhängen. Kürzel: SOLID macht Software solid.`,
  "patterns": `Was ist das?
Design Patterns sind bewährte Lösungsschablonen für wiederkehrende Probleme. Sie sind eine gemeinsame Sprache unter Entwicklern — "Wir brauchen hier ein Singleton."

Warum brauche ich das?
Patterns vermeiden, dass jeder das Rad neu erfindet. Sie sind in Java-Frameworks überall eingesetzt — Spring, Java EE, Collections-API.

Singleton — genau eine Instanz:
\\\`\\\`\\\`java
// Problem: Konfiguration soll nur einmal geladen werden
public class Konfiguration {
    // Einzige Instanz — private und static
    private static Konfiguration instanz;

    // Privater Konstruktor verhindert new Konfiguration()
    private Konfiguration() {
        System.out.println("Konfiguration wird geladen...");
    }

    // Zugriffsmethode
    public static Konfiguration getInstance() {
        if (instanz == null) {
            instanz = new Konfiguration();  // nur beim ersten Aufruf!
        }
        return instanz;
    }

    public String getWert(String key) { return "..."; }
}

// Verwendung
Konfiguration k1 = Konfiguration.getInstance();
Konfiguration k2 = Konfiguration.getInstance();
System.out.println(k1 == k2); // true — dasselbe Objekt!

// Thread-sicheres Singleton (für Multi-Threading)
public static synchronized Konfiguration getInstance() { ... }
// Oder: Enum-Singleton (Idiomatic Java, immer thread-sicher)
public enum KonfigSingleton { INSTANZ; public String getWert(String k) { return ""; } }
KonfigSingleton.INSTANZ.getWert("key");
\\\`\\\`\\\`

Factory Method — Objekte flexibel erstellen:
\\\`\\\`\\\`java
// Problem: Je nach Kontext unterschiedliche Objekte erstellen
public interface Benachrichtigung {
    void sende(String nachricht, String empfaenger);
}
public class EmailBenachrichtigung implements Benachrichtigung {
    public void sende(String msg, String an) {
        System.out.println("E-Mail an " + an + ": " + msg);
    }
}
public class SmsBenachrichtigung implements Benachrichtigung {
    public void sende(String msg, String an) {
        System.out.println("SMS an " + an + ": " + msg);
    }
}

// Factory — entscheidet welche Implementierung
public class BenachrichtigungsFactory {
    public static Benachrichtigung erstelle(String typ) {
        return switch (typ) {
            case "EMAIL" -> new EmailBenachrichtigung();
            case "SMS"   -> new SmsBenachrichtigung();
            default      -> throw new IllegalArgumentException("Unbekannter Typ: " + typ);
        };
    }
}

// Aufruf — Aufrufer weiß nicht welche konkrete Klasse er bekommt
Benachrichtigung b = BenachrichtigungsFactory.erstelle("EMAIL");
b.sende("Bestellung erhalten!", "anna@test.de");

Builder — komplexe Objekte Schritt für Schritt:
\\\`\\\`\\\`java
// Problem: Klasse mit vielen optionalen Parametern
// new Person("Anna", null, null, 0, null) — unleserlich!

public class Person {
    private final String name;         // Pflicht
    private final String email;        // optional
    private final String telefon;      // optional
    private final int alter;           // optional
    private final String adresse;      // optional

    // Privater Konstruktor — nur Builder darf ihn aufrufen
    private Person(Builder builder) {
        this.name     = builder.name;
        this.email    = builder.email;
        this.telefon  = builder.telefon;
        this.alter    = builder.alter;
        this.adresse  = builder.adresse;
    }

    // Statische Builder-Klasse
    public static class Builder {
        private final String name;   // Pflichtfeld im Builder-Konstruktor
        private String email, telefon, adresse;
        private int alter;

        public Builder(String name) { this.name = name; }

        // Jede Setter-Methode gibt this zurück → Method Chaining!
        public Builder email(String e)    { this.email = e;   return this; }
        public Builder telefon(String t)  { this.telefon = t; return this; }
        public Builder alter(int a)       { this.alter = a;   return this; }
        public Builder adresse(String a)  { this.adresse = a; return this; }

        public Person build() {
            // Validierung
            if (name == null || name.isBlank()) throw new IllegalStateException("Name fehlt");
            return new Person(this);
        }
    }
}

// Verwendung — lesbar und flexibel!
Person p = new Person.Builder("Anna Müller")
    .email("anna@test.de")
    .alter(28)
    .adresse("Musterstraße 1, Berlin")
    .build();

// In der Praxis: Lombok @Builder macht das automatisch!
\\\`\\\`\\\`

\\\`\\\`\\\`java
// Problem: Wenn sich Bestellung ändert, sollen Email + SMS + Lager reagieren
public interface BestellungsObserver {
    void onBestellungGeaendert(Bestellung b);
}

public class BestellungsService {
    private List<BestellungsObserver> observer = new ArrayList<>();

    public void addObserver(BestellungsObserver o)    { observer.add(o); }
    public void removeObserver(BestellungsObserver o) { observer.remove(o); }

Refactoring verbessert die interne Struktur von Code ohne sein beobachtbares Verhalten zu ändern. Code wird lesbarer, verständlicher und wartbarer.

Warum brauche ich das?
Code veraltet. Was heute sauber ist, wird durch neue Features und Bugfixes mit der Zeit unübersichtlich. Regelmäßiges Refactoring hält den Code gesund.

public void sendeBericht(Benutzer user, List<Bestellung> bestellungen) {

}

// SMELL 2: Zu viele Parameter (>3-4)

Die wichtigsten Refactoring-Techniken:
\\\`\\\`\\\`java
// EXTRACT METHOD — Code in eigene Methode auslagern
// Vorher:
public void verarbeite(Bestellung b) {
    double preis = b.getBetrag();
    if (b.getKundenTyp().equals("PREMIUM")) preis *= 0.9;
    if (b.getMenge() > 10) preis *= 0.95;
    double steuer = preis * 0.19;
    double gesamt = preis + steuer;
    // ... 40 weitere Zeilen
}

// Nachher: Extract Method
public void verarbeite(Bestellung b) {
    double netto   = berechneNetto(b);
    double gesamt  = berechneGesamt(netto);
    speichern(b, gesamt);
    emailSenden(b);
}
private double berechneNetto(Bestellung b) {
    double preis = b.getBetrag();
    if (b.getKundenTyp().equals("PREMIUM")) preis *= 0.9;
    return b.getMenge() > 10 ? preis * 0.95 : preis;
}

// INTRODUCE PARAMETER OBJECT — viele Parameter als Klasse
// Vorher:
public void erstelle(String strasse, String plz, String ort, String land) {}

// Nachher:
public record Adresse(String strasse, String plz, String ort, String land) {}
public void erstelle(Adresse adresse) {}

// REPLACE CONDITIONAL WITH POLYMORPHISM
// Vorher:
double rabatt = switch(kundenTyp) {
    case "PREMIUM" -> 0.1;
    case "STUDENT" -> 0.15;
    default -> 0.0;
};
// Nachher: Strategy Pattern (siehe Design Patterns)

// EXTRACT CLASS — zu große Klasse aufteilen
// Vorher: Person hat Felder für Adresse
// Nachher: Person hat Adresse-Objekt

Validierung prüft ob eingehende Daten korrekt sind, bevor sie verarbeitet werden. Spring Boot integriert Jakarta Bean Validation nahtlos.

Warum brauche ich das?
Ungültige Daten in der Datenbank zu speichern ist gefährlich. Frühzeitige Validierung schützt die Anwendung und gibt dem Client klares Feedback.

Validierungsannotationen auf DTOs:

import jakarta.validation.constraints.*;

public record KundeDto(
    @NotBlank(message = "Vorname darf nicht leer sein")
    String vorname,

    @NotBlank(message = "Nachname darf nicht leer sein")
    String nachname,

    @Email(message = "Ungültige E-Mail-Adresse")
    @NotBlank(message = "E-Mail ist Pflichtfeld")
    String email,

    @Min(value = 0,   message = "Alter muss positiv sein")
    @Max(value = 150, message = "Ungültiges Alter")
    int alter,

    @Size(min = 5, max = 20, message = "Passwort muss 5-20 Zeichen lang sein")
    @NotNull(message = "Passwort ist Pflichtfeld")
    String passwort,

Globale Fehlerbehandlung mit @RestControllerAdvice:
\\\`\\\`\\\`java
import org.springframework.web.bind.MethodArgumentNotValidException;

@RestControllerAdvice  // gilt für ALLE Controller
public class GlobalExceptionHandler {

    // Validierungsfehler → 400 Bad Request
    @ExceptionHandler(MethodArgumentNotValidException.class)
    public ResponseEntity<Map<String, String>> handleValidierung(
            MethodArgumentNotValidException ex) {

        Map<String, String> fehler = new LinkedHashMap<>();
        ex.getBindingResult().getFieldErrors().forEach(error ->
            fehler.put(error.getField(), error.getDefaultMessage())
        );
        return ResponseEntity.badRequest().body(fehler);
        // Response: {"vorname": "Vorname darf nicht leer sein", "email": "Ungültige E-Mail"}
    }

    // Ressource nicht gefunden → 404
    @ExceptionHandler(NoSuchElementException.class)
    public ResponseEntity<String> handleNotFound(NoSuchElementException ex) {
        return ResponseEntity.notFound().build();
    }

    // Alle anderen Fehler → 500
    @ExceptionHandler(Exception.class)
    public ResponseEntity<String> handleAllgemein(Exception ex) {
        return ResponseEntity.internalServerError()
                             .body("Interner Fehler: " + ex.getMessage());
    }
}

// Eigene Annotation
@Target({ElementType.FIELD})
@Retention(RetentionPolicy.RUNTIME)
@Constraint(validatedBy = IbanValidator.class)
public @interface GueltigeIban {
    String message() default "Ungültige IBAN";
    Class<?>[] groups() default {};
    Class<? extends Payload>[] payload() default {};
}

// Validator
public class IbanValidator implements ConstraintValidator<GueltigeIban, String> {
    @Override
    public boolean isValid(String iban, ConstraintValidatorContext ctx) {
        if (iban == null) return true; // null-Handling @NotNull überlassen
        return iban.matches("[A-Z]{2}[0-9]{2}[A-Z0-9]{4,30}");
    }
}

// Verwendung

    @GueltigeIban String iban
) {}

  "spring-sec": `Was ist das?
Spring Security schützt Webanwendungen durch Authentifizierung (Wer bist du?) und Autorisierung (Was darfst du?). Es ist der Standard für Security in Java-Webapps.

Warum brauche ich das?
Ohne Security kann jeder auf alle Daten zugreifen. Spring Security schützt Endpunkte, verwaltet Benutzer und integriert sich nahtlos in Spring Boot.

Basis-Konfiguration:
\\\`\\\`\\\`java
import org.springframework.security.config.annotation.web.builders.HttpSecurity;
import org.springframework.context.annotation.*;
import org.springframework.security.web.SecurityFilterChain;

@Configuration
@EnableWebSecurity
public class SecurityConfig {

    @Bean
    public SecurityFilterChain filterChain(HttpSecurity http) throws Exception {
        http
            .authorizeHttpRequests(auth -> auth
                // Öffentlich zugängliche Endpunkte
                .requestMatchers("/api/public/**").permitAll()
                .requestMatchers("/api/auth/**").permitAll()
                .requestMatchers(HttpMethod.GET, "/api/produkte").permitAll()

                // Nur für eingeloggte Benutzer
                .requestMatchers("/api/kunden/**").authenticated()

                // Nur für bestimmte Rolle
                .requestMatchers("/api/admin/**").hasRole("ADMIN")
                .requestMatchers("/api/reports/**").hasAnyRole("ADMIN", "MANAGER")

                // Alles andere: eingeloggt
                .anyRequest().authenticated()
            )
            .httpBasic(Customizer.withDefaults())   // HTTP Basic Auth
            .csrf(csrf -> csrf.disable());           // für REST APIs deaktivieren
        return http.build();
    }

    // Passwörter IMMER hashen!
    @Bean
    public PasswordEncoder passwordEncoder() {
        return new BCryptPasswordEncoder();  // BCrypt ist Standard
    }
}
\\\`\\\`\\\`

public class BenutzerDetailsService implements UserDetailsService {

    private final BenutzerRepository repo;
    private final PasswordEncoder encoder;

    @Override
    public UserDetails loadUserByUsername(String username) {
        Benutzer b = repo.findByUsername(username)
            .orElseThrow(() -> new UsernameNotFoundException("Benutzer: " + username));

        return User.builder()
            .username(b.getUsername())
            .password(b.getPasswortHash())  // bereits gehasht in DB!
            .roles(b.getRolle())
            .build();

  "nested": `Was ist das?
Innere Klassen sind Klassen, die innerhalb einer anderen Klasse definiert werden. Java kennt vier Varianten — jede für einen anderen Anwendungsfall.

Warum brauche ich das?
Innere Klassen helfen, eng zusammengehörige Logik zu kapseln und den Namensraum sauber zu halten.

Die vier Varianten:
\\\`\\\`\\\`java
public class Aussen {
    private int wert = 42;

    // 1. STATISCHE verschachtelte Klasse — kein Zugriff auf Aussen-Instanz
    public static class Statisch {
        public void info() {
            System.out.println("Statische innere Klasse");
            // System.out.println(wert); // ✗ kein Zugriff auf Instanzfelder!
        }
    }

    // 2. INNERE Instanzklasse — hat Zugriff auf alle Felder der äußeren Klasse
    public class Innen {
        public void zeigeWert() {
            System.out.println("Wert: " + wert); // ✓ Zugriff auf private Feld!
        }
    }

    public void methode() {
        // 3. LOKALE Klasse — nur innerhalb dieser Methode sichtbar
        class Lokal {
            void gruessen() { System.out.println("Lokal: " + wert); }
        }
        new Lokal().gruessen();

        // 4. ANONYME Klasse — einmalige Implementierung ohne Namen
        Runnable r = new Runnable() {
            @Override
            public void run() {
                System.out.println("Anonym läuft! Wert: " + wert);
            }
        };
        r.run();

        // Heute meist als Lambda:
        Runnable modern = () -> System.out.println("Modern: " + wert);
        modern.run();
    }
}
\\\`\\\`\\\`

Verwendung und wann welche:
\\\`\\\`\\\`java
// Statische innere Klasse: kein Objekt der äußeren Klasse nötig
Aussen.Statisch s = new Aussen.Statisch();
s.info();

// Innere Instanzklasse: braucht ein Aussen-Objekt
Aussen a = new Aussen();
Aussen.Innen i = a.new Innen();  // besondere Syntax!
i.zeigeWert();

// Praxisbeispiel: Builder-Pattern als statische innere Klasse
public class Person {
    private final String name;
    private final int alter;

    private Person(Builder b) { this.name = b.name; this.alter = b.alter; }

    public static class Builder {  // ← statische innere Klasse
        private String name;
        private int alter;

        public Builder name(String n)  { this.name = n;  return this; }
        public Builder alter(int a)    { this.alter = a; return this; }
        public Person build()          { return new Person(this); }
    }
}

Person p = new Person.Builder().name("Anna").alter(25).build();
