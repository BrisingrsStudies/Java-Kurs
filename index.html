🏆 Best Practices:
\\\`\\\`\\\`
✓ Statische innere Klasse bevorzugen — hält weniger Referenzen
✓ Anonyme Klassen durch Lambdas ersetzen (kürzer, lesbarer)
✓ Innere Klasse nur wenn sie NUR in der äußeren Klasse Sinn ergibt
✓ Builder-Pattern klassisch als statische innere Klasse
✗ Keine tief verschachtelten inneren Klassen (schwer lesbar)
\\\`\\\`\\\`

💡 Merksatz: Anonyme Klassen → heute Lambda. Statische innere Klasse → kein Zugriff auf Außen-Instanz, kein äußeres Objekt nötig. Innere Instanzklasse → hat Zugriff auf alles, braucht aber äußeres Objekt.`,
  "iterator": `Was ist das?
Iterator ist ein Entwurfsmuster das das Durchlaufen einer Sammlung ermöglicht, ohne deren interne Struktur zu kennen. Die for-each-Schleife nutzt intern immer Iterator.

Warum brauche ich das?
Mit Iterator kannst du sicher während des Durchlaufs Elemente entfernen — etwas das mit der for-each-Schleife nicht möglich ist.

Iterator manuell verwenden:
\\\`\\\`\\\`java
import java.util.*;

List<String> namen = new ArrayList<>(List.of("Anna", "Ben", "Clara", "Alex"));

// Manueller Iterator
Iterator<String> it = namen.iterator();
while (it.hasNext()) {           // gibt es noch ein nächstes Element?
    String name = it.next();     // nächstes Element holen (Zeiger weiter)
    System.out.println(name);

    // SICHER: während Iteration entfernen
    if (name.startsWith("A")) {
        it.remove();             // ✓ korrekte Methode zum Entfernen!
    }
}
System.out.println(namen);  // [Ben, Clara]

// FALSCH — ConcurrentModificationException!
for (String name : namen) {
    if (name.startsWith("B")) {
        namen.remove(name);  // ✗ niemals so!
    }
}
\\\`\\\`\\\`

ListIterator — bidirektional:
\\\`\\\`\\\`java
List<Integer> zahlen = new ArrayList<>(List.of(1, 2, 3, 4, 5));
ListIterator<Integer> lit = zahlen.listIterator(zahlen.size()); // am Ende starten

// Rückwärts durchlaufen
while (lit.hasPrevious()) {
    System.out.print(lit.previous() + " ");  // 5 4 3 2 1
}

// Ersetzen während Iteration
ListIterator<Integer> lit2 = zahlen.listIterator();
while (lit2.hasNext()) {
    int z = lit2.next();
    lit2.set(z * 2);  // Wert ersetzen
}
System.out.println(zahlen);  // [2, 4, 6, 8, 10]
\\\`\\\`\\\`

Iterable — eigene Klasse for-each-fähig machen:
\\\`\\\`\\\`java
// Eigene Klasse die for-each unterstützt
public class Zahlenbereich implements Iterable<Integer> {
    private final int von;
    private final int bis;

    public Zahlenbereich(int von, int bis) {
        this.von = von; this.bis = bis;
    }

    @Override
    public Iterator<Integer> iterator() {
        return new Iterator<>() {
            private int aktuell = von;

            @Override public boolean hasNext() { return aktuell <= bis; }
            @Override public Integer next()    { return aktuell++; }
        };
    }
}

// Jetzt ist for-each möglich!
for (int z : new Zahlenbereich(1, 5)) {
    System.out.print(z + " ");  // 1 2 3 4 5
}
\\\`\\\`\\\`

🏆 Best Practices:
\\\`\\\`\\\`
✓ Elemente während Iteration? → Iterator.remove() verwenden
✓ Nur lesen? → for-each ist kürzer und lesbarer
✓ Rückwärts oder Ersetzen? → ListIterator
✓ Eigene Sammlungsklasse? → Iterable implementieren für for-each Support
✗ Niemals Collection.remove() innerhalb einer for-each-Schleife
\\\`\\\`\\\`

💡 Merksatz: Die for-each-Schleife ist syntaktischer Zucker für Iterator. Elemente während der Iteration nur über it.remove() löschen — niemals direkt an der Collection.`,
  "functional": `Was ist das?
Funktionale Interfaces haben genau eine abstrakte Methode (SAM — Single Abstract Method). Sie sind die Grundlage für Lambdas und die gesamte Streams API.

Warum brauche ich das?
Java 8 führte funktionale Programmierung ein. Wer Lambdas und Streams versteht, muss funktionale Interfaces kennen — sie sind das Fundament.

Die wichtigsten funktionalen Interfaces aus java.util.function:
\\\`\\\`\\\`java
import java.util.function.*;

// Predicate<T>: T → boolean  (Bedingung prüfen)
Predicate<String> istLang   = s -> s.length() > 5;
Predicate<Integer> istGerade = n -> n % 2 == 0;
System.out.println(istLang.test("Programmieren")); // true
System.out.println(istGerade.test(4));             // true

// Prädikate kombinieren
Predicate<String> langUndGrossgeschrieben = istLang.and(s -> s.equals(s.toUpperCase()));
Predicate<Integer> geradeoderGroesser10   = istGerade.or(n -> n > 10);
Predicate<String> nichtLang              = istLang.negate();

// Function<T, R>: T → R  (umwandeln)
Function<String, Integer> laenge    = String::length;
Function<String, String>  grossBuch = String::toUpperCase;
System.out.println(laenge.apply("Java"));        // 4
System.out.println(grossBuch.apply("hallo"));   // "HALLO"

// Verkettung
Function<String, String> laengeAlsString = laenge.andThen(Object::toString);
Function<String, Integer> trimUndLaenge  = grossBuch.andThen(laenge); // erst groß, dann länge

// Consumer<T>: T → void  (verbrauchen, Seiteneffekt)
Consumer<String> drucker   = System.out::println;
Consumer<String> speicherer = s -> datenbank.save(s);
drucker.accept("Hallo");                    // "Hallo"
drucker.andThen(speicherer).accept("Test"); // drucken UND speichern

// Supplier<T>: () → T  (liefern ohne Parameter)
Supplier<String>  gruss   = () -> "Guten Morgen!";
Supplier<List<?>> listFab = ArrayList::new;
System.out.println(gruss.get());  // "Guten Morgen!"

// BiFunction<T, U, R>: (T, U) → R  (zwei Eingaben)
BiFunction<String, Integer, String> wiederholen = (s, n) -> s.repeat(n);
System.out.println(wiederholen.apply("Ha", 3)); // "HaHaHa"

// UnaryOperator<T>: T → T  (gleicher Typ rein und raus)
UnaryOperator<String> trimmer = String::trim;
UnaryOperator<Integer> verdoppeln = n -> n * 2;

// BinaryOperator<T>: (T, T) → T
BinaryOperator<Integer> summe = Integer::sum;
System.out.println(summe.apply(3, 4));  // 7
\\\`\\\`\\\`

Eigene funktionale Interfaces:
\\\`\\\`\\\`java
@FunctionalInterface  // ← optional, aber empfohlen: Compiler prüft es
public interface Konvertierer<E, A> {
    A konvertiere(E eingabe);
}

// Verwendung
Konvertierer<String, Integer> stringZuInt = Integer::parseInt;
System.out.println(stringZuInt.konvertiere("42")); // 42

// Praktisch: Validierungsregel
@FunctionalInterface
interface Validierungsregel<T> {
    boolean pruefe(T wert);
    default Validierungsregel<T> und(Validierungsregel<T> andere) {
        return wert -> this.pruefe(wert) && andere.pruefe(wert);
    }
}

Validierungsregel<String> nichtLeer  = s -> !s.isBlank();
Validierungsregel<String> nichtNull  = s -> s != null;
Validierungsregel<String> beides     = nichtNull.und(nichtLeer);
\\\`\\\`\\\`

🏆 Best Practices:
\\\`\\\`\\\`
✓ @FunctionalInterface immer annotieren — Compiler-Schutz
✓ Predicate für Bedingungen, Function für Umwandlungen
✓ Predicate.and(), .or(), .negate() für Komposition statt langer Lambdas
✓ Supplier für lazy Initialisierung (nur berechnen wenn gebraucht)
✓ Eigene Interfaces nur wenn Standardinterfaces nicht passen
✗ Keine funktionalen Interfaces mit Seiteneffekten in Streams
\\\`\\\`\\\`

💡 Merksatz: Predicate prüft, Function wandelt um, Consumer verbraucht, Supplier liefert. Alle vier sind die Bausteine der Streams API.`,
  "methodref": `Was ist das?
Method References (Methodenreferenzen) sind eine noch kompaktere Schreibweise für Lambdas, die ausschließlich eine vorhandene Methode aufrufen.

Warum brauche ich das?
Überall wo ein Lambda nur eine Methode aufruft, macht eine Method Reference den Code kürzer und oft lesbarer.

Die vier Typen:
\\\`\\\`\\\`java
import java.util.*;
import java.util.function.*;

// TYP 1: Statische Methode — KlasseName::methode
// Lambda:           n -> Integer.parseInt(n)
// Method Reference: Integer::parseInt
Function<String, Integer> parser = Integer::parseInt;
System.out.println(parser.apply("42")); // 42

List<String> zahlenStrings = List.of("3", "1", "4", "1", "5");
zahlenStrings.stream()
    .map(Integer::parseInt)   // statt: s -> Integer.parseInt(s)
    .sorted()
    .forEach(System.out::println);

// TYP 2: Instanzmethode eines KONKRETEN Objekts — objekt::methode
String prefix = "Hallo, ";
Function<String, String> begruesser = prefix::concat;
// Entspricht: s -> prefix.concat(s)
System.out.println(begruesser.apply("Anna")); // "Hallo, Anna"

PrintStream out = System.out;
Consumer<String> drucker = out::println;  // statt: s -> System.out.println(s)
// Häufigste Method Reference überhaupt:
Consumer<String> standard = System.out::println;

// TYP 3: Instanzmethode eines TYPS — KlasseName::methode
// Lambda:           s -> s.toUpperCase()
// Method Reference: String::toUpperCase
List<String> namen = List.of("anna", "ben", "clara");
namen.stream()
    .map(String::toUpperCase)      // statt: s -> s.toUpperCase()
    .map(String::trim)             // statt: s -> s.trim()
    .forEach(System.out::println); // statt: s -> System.out.println(s)

// Vergleich mit Comparator
namen.sort(String::compareTo);          // statt: (a, b) -> a.compareTo(b)
namen.sort(String::compareToIgnoreCase);

// TYP 4: Konstruktor — KlasseName::new
Supplier<ArrayList<String>> listFactory = ArrayList::new;
// Entspricht: () -> new ArrayList<>()
ArrayList<String> neueListe = listFactory.get();

Function<String, StringBuilder> sbFactory = StringBuilder::new;
// Entspricht: s -> new StringBuilder(s)
StringBuilder sb = sbFactory.apply("Start");

// In Streams: collect(Collectors.toCollection(ArrayList::new))
List<String> gemacht = namen.stream()
    .collect(java.util.stream.Collectors.toCollection(ArrayList::new));
\\\`\\\`\\\`

Wann Lambda, wann Method Reference?
\\\`\\\`\\\`java
// Method Reference wenn Lambda NUR eine Methode aufruft:
namen.forEach(s -> System.out.println(s));  // Lambda
namen.forEach(System.out::println);          // Method Reference ✓ kürzer

// Lambda wenn eigene Logik dabei ist:
namen.forEach(s -> System.out.println("Name: " + s));  // Lambda bleibt Lambda
// System.out::println würde nicht "Name: " vorne ausgeben!

// Sorted
namen.sort((a, b) -> a.compareToIgnoreCase(b));  // Lambda
namen.sort(String::compareToIgnoreCase);           // Method Reference ✓

// Filter — meist Lambda (Bedingung mit Operator)
namen.stream().filter(s -> s.length() > 3);       // Lambda (kein direkter Methodenaufruf)
namen.stream().filter(Predicate.not(String::isBlank)); // Method Reference mit Predicate.not()
\\\`\\\`\\\`

🏆 Best Practices:
\\\`\\\`\\\`
✓ Method Reference verwenden wenn Lambda NUR einen Methodenaufruf enthält
✓ System.out::println ist die häufigste — auswendig lernen
✓ Konstruktor-Referenz (ArrayList::new) in Collectors verwenden
✓ Lesbarkeit entscheidet — manchmal ist Lambda klarer
✗ Nie auf Biegen und Brechen Method References erzwingen wenn Lambda klarer ist
\\\`\\\`\\\`

💡 Merksatz: :: funktioniert nur wenn das Lambda AUSSCHLIESSLICH eine Methode aufruft. Vier Typen: statisch (Math::sqrt), Objekt (System.out::println), Typ (String::toUpperCase), Konstruktor (ArrayList::new).`,
  "oop-prinzipien": `Was ist das?
OOP (Objektorientierte Programmierung) basiert auf vier Hauptprinzipien: Kapselung, Vererbung, Polymorphismus und Abstraktion. Diese Prinzipien sind das Fundament von Java.

Warum brauche ich das?
Diese vier Prinzipien werden in JEDEM Java-Vorstellungsgespräch gefragt. Wer sie versteht, versteht warum Java so designt ist wie es ist.

Die vier Säulen der OOP:
\\\`\\\`\\\`java
// ════════════════════════════════════════════
// 1. KAPSELUNG (Encapsulation)
// ════════════════════════════════════════════
// Daten und Methoden gehören zusammen.
// Interna werden versteckt, Zugriff nur über definierte Schnittstelle.

public class BankKonto {
    private double kontostand;  // ← VERSTECKT (private)
    private String iban;

    public void einzahlen(double betrag) {  // ← kontrollierter Zugriff
        if (betrag > 0) kontostand += betrag;
    }
    public double getKontostand() { return kontostand; } // ← nur lesen
    // kein setKontostand() → Wert kann nicht beliebig gesetzt werden!
}

// ════════════════════════════════════════════
// 2. VERERBUNG (Inheritance)
// ════════════════════════════════════════════
// Klassen können Eigenschaften von anderen Klassen übernehmen.
// Verhindert Code-Duplizierung durch Wiederverwendung.

public class Tier {
    protected String name;
    public void atmen() { System.out.println(name + " atmet."); }
}

public class Hund extends Tier {  // ← erbt alles von Tier
    public void bellen() { System.out.println(name + ": Wuff!"); }
}
// Hund hat BEIDE Methoden: atmen() (geerbt) + bellen() (eigen)

// ════════════════════════════════════════════
// 3. POLYMORPHISMUS (Polymorphism)
// ════════════════════════════════════════════
// Gleiche Schnittstelle, unterschiedliches Verhalten.
// Welche Methode aufgerufen wird, entscheidet sich erst zur Laufzeit.

public class Tier {
    public void lautGeben() { System.out.println("..."); }
}
public class Hund  extends Tier { @Override public void lautGeben() { System.out.println("Wuff!"); } }
public class Katze extends Tier { @Override public void lautGeben() { System.out.println("Miau!"); } }

Tier[] tiere = { new Hund(), new Katze(), new Hund() };
for (Tier t : tiere) {
    t.lautGeben();  // ← gleicher Aufruf, unterschiedliches Verhalten!
}
// Ausgabe: Wuff! / Miau! / Wuff!

// ════════════════════════════════════════════
// 4. ABSTRAKTION (Abstraction)
// ════════════════════════════════════════════
// Komplexität verstecken, nur das Wesentliche zeigen.
// WAS etwas tut ist sichtbar, WIE ist verborgen.

public interface Druckbar {    // ← Abstraktion: nur WAS
    void drucken();
}

public class PDF implements Druckbar {
    @Override
    public void drucken() {
        // WIE: komplexe PDF-Rendering-Logik
        System.out.println("PDF wird gerendert und gedruckt...");
    }
}

Druckbar d = new PDF();
d.drucken();  // Aufrufer weiß nicht wie es gedruckt wird — nur dass es geht
\\\`\\\`\\\`

Alle vier zusammen — ein vollständiges Beispiel:
\\\`\\\`\\\`java
// ABSTRAKTION: Interface definiert WAS möglich ist
public interface Fahrzeug {
    void starten();
    void fahren(int km);
    int getKmStand();
}

// KAPSELUNG: Interna versteckt, kontrollierter Zugriff
public abstract class FahrzeugBasis implements Fahrzeug {
    private int kmStand = 0;    // ← privat, niemand kann direkt setzen

    protected void addKm(int km) {
        if (km > 0) kmStand += km;
    }

    @Override
    public int getKmStand() { return kmStand; }  // ← nur lesen erlaubt
}

// VERERBUNG: Auto erbt von FahrzeugBasis
public class Auto extends FahrzeugBasis {
    private String marke;
    private boolean laeuft = false;

    public Auto(String marke) { this.marke = marke; }

    @Override
    public void starten() { laeuft = true; System.out.println(marke + " startet."); }

    @Override
    public void fahren(int km) {
        if (laeuft) { addKm(km); System.out.println(marke + " fährt " + km + " km."); }
        else System.out.println("Motor läuft nicht!");
    }
}

// POLYMORPHISMUS: verschiedene Fahrzeuge, gleiche Schnittstelle
Fahrzeug[] flotte = { new Auto("VW"), new Auto("BMW") };
for (Fahrzeug f : flotte) {
    f.starten();
    f.fahren(100);
    System.out.println("KM-Stand: " + f.getKmStand());
}
\\\`\\\`\\\`

🏆 Best Practices — OOP richtig anwenden:
\\\`\\\`\\\`
KAPSELUNG:
  ✓ Felder immer private, Zugriff über Getter/Setter
  ✓ Setter mit Validierung
  ✓ Unveränderliche Felder: private final + nur Getter
  ✗ Niemals public Felder (außer Konstanten: public static final)

VERERBUNG:
  ✓ Vererbung für "ist-ein" Beziehungen (Hund IST EIN Tier)
  ✓ Komposition für "hat-ein" Beziehungen (Auto HAT EINEN Motor)
  ✓ @Override immer schreiben
  ✗ Keine Vererbung nur um Code zu wiederverwenden
  ✗ Keine tiefen Vererbungshierarchien (max 2-3 Ebenen)

POLYMORPHISMUS:
  ✓ Auf Interface/Basisklassen-Typ programmieren: List<> statt ArrayList<>
  ✓ instanceof + Pattern Matching statt instanceof + Cast
  ✗ Keine langen if-instanceof-Ketten — lieber Polymorphismus nutzen

ABSTRAKTION:
  ✓ Interfaces für Fähigkeiten ("kann fahren"), abstrakte Klasse für Familien
  ✓ Minimales Interface — nur was wirklich gebraucht wird
  ✗ Keine Abstraktion wenn es nur eine Implementierung gibt (YAGNI-Prinzip)
\\\`\\\`\\\`

Vererbung vs. Komposition — die wichtigste OOP-Entscheidung:
\\\`\\\`\\\`java
// VERERBUNG: "ist-ein" ✓
class Hund extends Tier { ... }           // Hund IST EIN Tier

// KOMPOSITION: "hat-ein" ✓ (oft besser!)
class Auto {
    private Motor motor;                  // Auto HAT EINEN Motor
    private Getriebe getriebe;
    // statt: class Auto extends Motor — Auto IST KEIN Motor!
}

// Faustregel: "Composition over Inheritance"
// Komposition ist flexibler und loser gekoppelt
\\\`\\\`\\\`

💡 Merksatz: Kapselung = verstecken, Vererbung = wiederverwenden, Polymorphismus = austauschen, Abstraktion = vereinfachen. Diese vier Prinzipien zusammen machen OOP mächtig.`,
  "projekt-1": `Was ist das?
Dein erstes richtiges Java-Projekt — ein Taschenrechner mit Verlaufsspeicher.

Anforderungen:
\\\`\\\`\\\`
ZEIT: ca. 2-3 Stunden   SCHWIERIGKEIT: ⭐⭐

✓ Addition, Subtraktion, Multiplikation, Division
✓ Eingabe: 2 Zahlen + Operation
✓ Ergebnis mit 2 Nachkommastellen ausgeben
✓ Division durch 0 abfangen
✓ Letzten 5 Berechnungen in einem Array speichern
✓ Verlauf am Ende ausgeben
✓ Schleife bis Benutzer 'quit' eingibt
\\\`\\\`\\\`

Vorgeschlagene Struktur:
\\\`\\\`\\\`java
import java.util.Scanner;

public class Taschenrechner {
    static String[] verlauf = new String[5];
    static int verlaufIndex = 0;

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        System.out.println("=== Java Taschenrechner ===");
        while (true) {
            System.out.print("Erste Zahl: ");
            double a = sc.nextDouble();
            System.out.print("Operation (+,-,*,/, quit): ");
            String op = sc.next();
            if (op.equals("quit")) break;
            System.out.print("Zweite Zahl: ");
            double b = sc.nextDouble();
            try {
                double ergebnis = berechne(a, op, b);
                String eintrag = String.format("%.2f %s %.2f = %.2f", a, op, b, ergebnis);
                verlauf[verlaufIndex % verlauf.length] = eintrag;
                verlaufIndex++;
                System.out.println("→ " + eintrag);
            } catch (Exception e) {
                System.out.println("Fehler: " + e.getMessage());
            }
        }
        System.out.println("\\\\n--- Verlauf ---");
        for (String e : verlauf) { if (e != null) System.out.println(e); }
        sc.close();
    }

    static double berechne(double a, String op, double b) {
        return switch (op) {
            case "+" -> a + b;
            case "-" -> a - b;
            case "*" -> a * b;
            case "/" -> {
                if (b == 0) throw new ArithmeticException("Division durch 0!");
                yield a / b;
            }
            default -> throw new IllegalArgumentException("Unbekannte Operation: " + op);
        };
    }
}
\\\`\\\`\\\`

Tipps:
\\\`\\\`\\\`java
// Ring-Puffer: nach 5 Eintraegen wieder von vorne
verlauf[verlaufIndex % 5] = neuerEintrag;
verlaufIndex++;

// Division durch 0 abfangen
if (b == 0) throw new ArithmeticException("Division durch 0!");
\\\`\\\`\\\`

Ein objektorientiertes Bankverwaltungs-System — dein erstes echtes OOP-Projekt.

KLASSEN:

Vorgeschlagene Struktur:
\\\`\\\`\\\`java
public abstract class Konto {
    private static int naechsteNummer = 1000;
    private final int kontonummer;
    private final String inhaber;
    private double kontostand;

    public Konto(String inhaber, double start) {
        this.kontonummer = naechsteNummer++;
        this.inhaber = inhaber;
        if (start < 0) throw new IllegalArgumentException("Negativer Startbetrag!");
        this.kontostand = start;

STREAMS (alle folgenden mit Streams loesen):

import java.util.*;
import java.util.stream.*;
import java.util.function.*;

public record Student(String name, int matrikelnummer,
                      int semester, List<Double> noten) {
    public double durchschnitt() {
        return noten.stream().mapToDouble(Double::doubleValue).average().orElse(0);
    }
    public boolean bestanden() { return durchschnitt() <= 4.0; }
    public double bestNote()   { return noten.stream().mapToDouble(d->d).min().orElse(0); }
}

public class Verwaltung<T> {
    protected List<T> eintraege = new ArrayList<>();
    public void hinzufuegen(T e) { eintraege.add(e); }
    public List<T> filter(Predicate<T> bed) {
        return eintraege.stream().filter(bed).collect(Collectors.toList());
    }
}

public class StudentenVerwaltung extends Verwaltung<Student> {
    public List<Student> bestandene() { return filter(Student::bestanden); }

    public List<Student> top3() {
        return eintraege.stream()
            .sorted(Comparator.comparingDouble(Student::durchschnitt))
            .limit(3)
            .collect(Collectors.toList());
    }

    public Map<Integer, List<Student>> nachSemester() {
        return eintraege.stream().collect(Collectors.groupingBy(Student::semester));
    }

    public void statistikAusgeben() {
        System.out.printf("Gesamt: %d | Bestanden: %d%n",
            eintraege.size(), bestandene().size());
        eintraege.stream().mapToDouble(Student::durchschnitt).average()
            .ifPresent(d -> System.out.printf("Schnitt: %.2f%n", d));
        System.out.println("\\\\nPro Semester:");
        nachSemester().forEach((sem, l) ->
            System.out.printf("  Sem. %d: %d Studenten%n", sem, l.size()));
    }
}

public record Kontakt(int id, String name, String telefon,
                      String email, String kategorie) {}

public class KontaktRepository {
    private final java.sql.Connection conn;

    public KontaktRepository() throws Exception {
        // Datei-DB: Daten bleiben nach Programmende erhalten!
        conn = java.sql.DriverManager.getConnection("jdbc:h2:./kontakte","sa","");
        conn.createStatement().execute(
            "CREATE TABLE IF NOT EXISTS kontakte(" +
            "id INT PRIMARY KEY AUTO_INCREMENT," +
            "name VARCHAR(100) NOT NULL," +
            "telefon VARCHAR(20),email VARCHAR(100)," +
            "kategorie VARCHAR(20) DEFAULT 'SONSTIGE')");
    }

    public void einfuegen(String name, String tel, String email, String kat)
            throws Exception {
        var ps = conn.prepareStatement(
            "INSERT INTO kontakte(name,telefon,email,kategorie) VALUES(?,?,?,?)");
        ps.setString(1,name); ps.setString(2,tel);
        ps.setString(3,email); ps.setString(4,kat);
        ps.executeUpdate();
    }

    public java.util.List<Kontakt> alle() throws Exception {
        var liste = new java.util.ArrayList<Kontakt>();
        var rs = conn.createStatement().executeQuery(
            "SELECT * FROM kontakte ORDER BY name");
        while (rs.next()) {
            liste.add(new Kontakt(rs.getInt("id"), rs.getString("name"),
                rs.getString("telefon"), rs.getString("email"),
                rs.getString("kategorie")));
        }
        return liste;
    }

    public java.util.List<Kontakt> suchen(String s) throws Exception {
        var liste = new java.util.ArrayList<Kontakt>();
        var ps = conn.prepareStatement(
            "SELECT * FROM kontakte WHERE name LIKE ?");
        ps.setString(1, "%" + s + "%");
        var rs = ps.executeQuery();
        while (rs.next()) {
            liste.add(new Kontakt(rs.getInt("id"),rs.getString("name"),
                rs.getString("telefon"),rs.getString("email"),rs.getString("kategorie")));
        }
        return liste;
    }
}

@Entity
public class Todo {
    @Id @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;
    @Column(nullable = false)
    private String titel;
    private String beschreibung;
    private boolean fertig = false;
    // Getter, Setter, Konstruktor...
}

public record TodoDto(
    @NotBlank(message = "Titel darf nicht leer sein")
    @Size(max = 100) String titel,
    @Size(max = 500) String beschreibung
) {}

public interface TodoRepository extends JpaRepository<Todo, Long> {
    List<Todo> findByFertig(boolean fertig);
}

@RestController
@RequestMapping("/api/todos")
public class TodoController {
    private final TodoRepository repo;
    public TodoController(TodoRepository repo) { this.repo = repo; }

    @GetMapping
    public List<Todo> alle(@RequestParam(required=false) Boolean fertig) {
        return fertig != null ? repo.findByFertig(fertig) : repo.findAll();
    }

    @GetMapping("/{id}")
    public ResponseEntity<Todo> eins(@PathVariable Long id) {
        return repo.findById(id).map(ResponseEntity::ok)
                   .orElse(ResponseEntity.notFound().build());
    }

    @PostMapping
    public ResponseEntity<Todo> erstellen(@Valid @RequestBody TodoDto dto) {
        Todo t = new Todo(); t.setTitel(dto.titel()); t.setBeschreibung(dto.beschreibung());
        return ResponseEntity.status(201).body(repo.save(t));
    }

    @PatchMapping("/{id}/fertig")
    public ResponseEntity<Todo> alsFertig(@PathVariable Long id) {
        return repo.findById(id).map(t -> {
            t.setFertig(true); return ResponseEntity.ok(repo.save(t));
        }).orElse(ResponseEntity.notFound().build());
    }

    @DeleteMapping("/{id}")
    public ResponseEntity<Void> loeschen(@PathVariable Long id) {
        repo.deleteById(id); return ResponseEntity.noContent().build();
    }
}

@RestControllerAdvice
public class GlobalExceptionHandler {
    @ExceptionHandler(MethodArgumentNotValidException.class)
    public ResponseEntity<Map<String,String>> handleValidierung(
            MethodArgumentNotValidException ex) {
        var fehler = new java.util.LinkedHashMap<String,String>();
        ex.getBindingResult().getFieldErrors()
          .forEach(e -> fehler.put(e.getField(), e.getDefaultMessage()));
        return ResponseEntity.badRequest().body(fehler);
    }
}

public class BuchBereitsAusgeLiehenException extends RuntimeException {
    public BuchBereitsAusgeLiehenException(String isbn) {
        super("Bereits ausgeliehen: " + isbn);
    }
}

public class Buch {
    private final String titel, autor, isbn;
    private final int jahr;
    private boolean ausgeliehen = false;

    public Buch(String titel, String autor, String isbn, int jahr) {
        this.titel=titel; this.autor=autor; this.isbn=isbn; this.jahr=jahr;
    }
    public String getIsbn()       { return isbn; }
    public boolean isAusgeliehen(){ return ausgeliehen; }
    public void ausleihen()       { ausgeliehen = true; }
    public void zurueckgeben()    { ausgeliehen = false; }
}

public class Bibliothek {
    private final Map<String, Buch> buecher = new HashMap<>();

    public void hinzufuegen(Buch b) {
        if (buecher.containsKey(b.getIsbn()))
            throw new IsbnBereitsVorhandenException(b.getIsbn());
        buecher.put(b.getIsbn(), b);
    }

    public void ausleihen(String isbn, String name) {
        Buch b = buecher.get(isbn);
        if (b.isAusgeliehen()) throw new BuchBereitsAusgeLiehenException(isbn);
        b.ausleihen();
    }

    public void zurueckgeben(String isbn) { buecher.get(isbn).zurueckgeben(); }
    public int anzahlBuecher()           { return buecher.size(); }
    public boolean istVerfuegbar(String isbn) { return !buecher.get(isbn).isAusgeliehen(); }
}
