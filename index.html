const QUIZ = {
  "syntax": [{"q": "Wie heißt der Einstiegspunkt jedes Java-Programms? Schreibe die vollständige Methodensignatur.", "a": "public static void main(String[] args)", "h": "Denk an public, static, void und den Parameter"}, {"q": "Was ist der Unterschied zwischen System.out.println() und System.out.print()?", "a": "println() fügt einen Zeilenumbruch ans Ende, print() nicht.", "h": "ln = line"}, {"q": "Warum muss der Dateiname exakt dem Klassennamen entsprechen?", "a": "Der Java-Compiler erwartet dass jede public Klasse in einer Datei mit gleichem Namen liegt (HelloWorld.java für public class HelloWorld).", "h": "Der Compiler sucht die Klasse anhand des Dateinamens"}],
  "types": [{"q": "Welche 4 primitiven Typen verwendest du am häufigsten und wofür?", "a": "int (ganze Zahlen), double (Kommazahlen), boolean (true/false), char (einzelnes Zeichen). String ist kein primitiver Typ, sondern eine Klasse.", "h": "Denk an Zahlen, Wahrheitswerte und Zeichen"}, {"q": "Warum braucht long ein L am Ende (z.B. 9_000_000_000L)?", "a": "Ohne L interpretiert der Compiler die Zahl als int. Da 9 Milliarden zu groß für int ist, gibt es einen Compilerfehler. L markiert das Literal als long.", "h": "Was ist der maximale int-Wert?"}, {"q": "Was ist der Unterschied zwischen float und double?", "a": "double hat ~15 Stellen Genauigkeit (Standard für Kommazahlen), float nur ~7 Stellen und braucht ein f am Ende. In der Praxis immer double verwenden.", "h": "Welcher ist genauer?"}],
  "vars": [{"q": "Was ist der Unterschied zwischen Deklaration und Initialisierung?", "a": "Deklaration: int alter; (Variable wird angelegt, kein Wert). Initialisierung: alter = 17; (erster Wert wird gesetzt). Beides zusammen: int alter = 17;", "h": "Zwei separate Schritte"}, {"q": "Wann verwendest du final und wie heißt die Namenskonvention für Konstanten?", "a": "final wenn der Wert sich nie ändern soll. Konstanten: GROSS_MIT_UNTERSTRICHEN, z.B. final double MWST_SATZ = 0.19;", "h": "SCREAMING_SNAKE_CASE"}, {"q": "Was macht var (Java 10+) und wo darf man es NICHT verwenden?", "a": "var lässt den Compiler den Typ automatisch erkennen. Nur für lokale Variablen in Methoden erlaubt — NICHT für Felder, Parameter oder Rückgabetypen.", "h": "Typ-Inferenz, aber nur lokal"}],
  "operators": [{"q": "Was gibt 17 / 5 in Java aus und warum? Wie bekommst du 3.4?", "a": "Gibt 3 aus — Ganzzahldivision! Für 3.4: (double)17 / 5 oder 17.0 / 5 (mindestens ein Operand muss double sein).", "h": "Integer durch Integer = Integer"}, {"q": "Was ist der Unterschied zwischen && und & bei boolean?", "a": "&& ist Kurzschluss: wenn links false, wird rechts nicht mehr ausgewertet. & wertet immer beide Seiten aus. Für Sicherheitschecks (null != obj && obj.size() > 0) ist && wichtig.", "h": "Short-circuit evaluation"}, {"q": "Was ist der Unterschied zwischen i++ und ++i?", "a": "i++: erst Wert verwenden, dann erhöhen (Postfix). ++i: erst erhöhen, dann Wert verwenden (Präfix). int b = i++; gibt den alten Wert. int c = ++i; gibt den neuen.", "h": "Prefix vs. Postfix"}],
  "input": [{"q": "Welche Scanner-Methode liest eine ganze Zeile und welche nur eine Zahl?", "a": "nextLine() liest die ganze Zeile als String. nextInt() liest eine ganze Zahl. nextDouble() liest eine Kommazahl.", "h": "next vs. nextLine"}, {"q": "Was passiert wenn du nextInt() und dann nextLine() aufrufst?", "a": "nextInt() lässt den Zeilenumbruch im Puffer. Das nachfolgende nextLine() liest nur diesen Zeilenumbruch — ergibt einen leeren String. Lösung: extra nextLine() nach nextInt() einfügen.", "h": "Zeilenumbruch im Puffer"}, {"q": "Wie formatierst du eine Ausgabe wie '3.14' mit genau 2 Nachkommastellen?", "a": "System.out.printf(\"%.2f%n\", 3.14159); — %.2f bedeutet: float mit 2 Nachkommastellen. %n ist der plattformunabhängige Zeilenumbruch.", "h": "printf mit Formatstring"}],
  "cond": [{"q": "Was ist der ternäre Operator? Schreibe ein Beispiel.", "a": "Kurzform für if-else: String ergebnis = (punkte >= 60) ? \"Bestanden\" : \"Durchgefallen\"; Format: (Bedingung) ? WennTrue : WennFalse", "h": "? und : sind die Schlüsselzeichen"}, {"q": "Welchen Vorteil hat die switch-Expression (Java 14+) gegenüber dem klassischen switch?", "a": "Kein break nötig (kein Fall-through), kann einen Wert zurückgeben (Zuweisung möglich), mehrere Cases in einem (case 1, 2 ->), kompakter.", "h": "-> statt :"}, {"q": "Was passiert beim klassischen switch ohne break?", "a": "Fall-through: Der Code fällt in den nächsten case durch und führt auch diesen aus — ohne erneute Bedingungsprüfung. Das ist ein häufiger Bug.", "h": "Der Code läuft weiter"}],
  "loops": [{"q": "Wann verwendest du for, wann while, wann do-while?", "a": "for: wenn Anzahl der Wiederholungen bekannt ist. while: wenn eine Bedingung entscheidet (unbekannte Anzahl). do-while: wenn der Code mindestens einmal ausgeführt werden soll.", "h": "Bekannt vs. unbekannt vs. mindestens einmal"}, {"q": "Was ist der Unterschied zwischen break und continue?", "a": "break: Schleife sofort komplett beenden. continue: Rest des aktuellen Durchlaufs überspringen, aber Schleife läuft weiter.", "h": "Ganz raus vs. weiter zur nächsten Iteration"}, {"q": "Schreibe eine for-Schleife die alle geraden Zahlen von 2 bis 20 ausgibt.", "a": "for (int i = 2; i <= 20; i += 2) { System.out.println(i); } Oder: for (int i = 0; i <= 20; i++) { if (i % 2 == 0) System.out.println(i); }", "h": "Schrittweite 2 oder Modulo"}],
  "arrays": [{"q": "Bei welchem Index beginnt ein Array und welcher Index hat das letzte Element?", "a": "Arrays beginnen bei Index 0. Das letzte Element hat Index arr.length - 1. Ein Array mit 5 Elementen hat Indizes 0, 1, 2, 3, 4.", "h": "Null-basierte Indizierung"}, {"q": "Was ist eine ArrayIndexOutOfBoundsException und wie verhindert man sie?", "a": "Tritt auf wenn man auf einen Index zugreift der nicht existiert (< 0 oder >= length). Verhindern: Index immer gegen arr.length prüfen oder for-each verwenden.", "h": "Index außerhalb des gültigen Bereichs"}, {"q": "Was gibt Arrays.toString(arr) zurück und wozu braucht man es?", "a": "Gibt eine lesbare String-Darstellung zurück: [1, 2, 3]. System.out.println(arr) würde nur eine kryptische Speicheradresse ausgeben. Arrays.toString() ist für Debug-Ausgaben.", "h": "Lesbare Ausgabe eines Arrays"}],
  "methods": [{"q": "Was ist Method Overloading und wie entscheidet Java welche Methode aufgerufen wird?", "a": "Mehrere Methoden mit gleichem Namen aber unterschiedlichen Parametern. Java wählt die passende anhand der Anzahl und Typen der Argumente beim Aufruf — zur Compile-Zeit.", "h": "Gleicher Name, andere Parameter"}, {"q": "Was ist der Unterschied zwischen einer static und einer Instanzmethode?", "a": "static: gehört zur Klasse, kein Objekt nötig, kein Zugriff auf Instanzvariablen. Instanzmethode: braucht ein Objekt, hat Zugriff auf this und alle Felder.", "h": "Mit oder ohne Objekt aufrufbar?"}, {"q": "Was passiert wenn du return in einer void-Methode ohne Wert schreibst?", "a": "Die Methode wird sofort beendet (frühzeitiger Ausstieg). Das ist erlaubt und manchmal nützlich, z.B. return; nach einem Fehlercheck.", "h": "Frühzeitiger Ausstieg"}],
  "strings": [{"q": "Warum darf man Strings nicht mit == vergleichen? Was soll man stattdessen verwenden?", "a": "== vergleicht Referenzen (Speicheradressen), nicht den Inhalt. Zwei Strings mit gleichem Text können verschiedene Objekte sein. Immer equals() oder equalsIgnoreCase() verwenden.", "h": "Referenz vs. Wert"}, {"q": "Was bedeutet immutable bei Strings und was folgt daraus?", "a": "Strings können nach der Erstellung nicht verändert werden. Jede Methode (toUpperCase, replace, trim) gibt einen NEUEN String zurück — der Original bleibt unverändert.", "h": "Jede Methode gibt neuen String zurück"}, {"q": "Wann verwendet man StringBuilder statt String-Verkettung mit +?", "a": "Bei vielen Verkettungen in einer Schleife. String + in Schleifen erstellt bei jedem Durchlauf ein neues Objekt — sehr langsam. StringBuilder.append() ist effizient.", "h": "Performance bei vielen Operationen"}],
  "math": [{"q": "Wie erzeugst du eine Zufallszahl zwischen 1 und 6 (Würfel) mit Math.random()?", "a": "int wuerfel = (int)(Math.random() * 6) + 1; — Math.random() gibt 0.0 bis <1.0, mal 6 gibt 0-5.99, int-Cast gibt 0-5, +1 verschiebt auf 1-6.", "h": "* 6 dann + 1"}, {"q": "Was ist der Unterschied zwischen Math.round(), Math.floor() und Math.ceil()?", "a": "round(): kaufmännisch runden (3.5 → 4, 3.4 → 3). floor(): immer abrunden (3.9 → 3.0). ceil(): immer aufrunden (3.1 → 4.0).", "h": "Normal, unten, oben"}, {"q": "Wie berechnest du die Hypotenuse eines rechtwinkligen Dreiecks mit a=3, b=4?", "a": "double c = Math.sqrt(Math.pow(3, 2) + Math.pow(4, 2)); — Pythagoras: c² = a² + b², also c = √(9+16) = √25 = 5.", "h": "Pythagoras mit Math.sqrt und Math.pow"}],
  "casting": [{"q": "Was ist der Unterschied zwischen Widening und Narrowing Casting?", "a": "Widening: kleiner Typ → größerer Typ (int → double), automatisch, kein Datenverlust. Narrowing: größer → kleiner (double → int), manuell mit (int), Datenverlust möglich.", "h": "Automatisch vs. manuell"}, {"q": "Was gibt (int) 3.9 aus? Was wäre das korrekte Ergebnis wenn man runden will?", "a": "(int) 3.9 gibt 3 — Nachkommastellen werden einfach abgeschnitten, nicht gerundet! Für echtes Runden: Math.round(3.9) gibt 4L.", "h": "Abschneiden vs. Runden"}, {"q": "Was ist Autoboxing und wann braucht man es?", "a": "Automatische Umwandlung zwischen primitiven Typen (int) und Wrapper-Klassen (Integer). Nötig weil Collections keine primitiven Typen akzeptieren: List<Integer>, nicht List<int>.", "h": "Collections brauchen Objekte"}],
  "classes": [{"q": "Was ist der Unterschied zwischen einer Klasse und einem Objekt?", "a": "Klasse = Bauplan (einmal definiert). Objekt = konkretes Exemplar des Bauplans (beliebig oft mit new erzeugt). Wie Keksform (Klasse) und Keks (Objekt).", "h": "Bauplan vs. Exemplar"}, {"q": "Was macht das Schlüsselwort this und wann braucht man es?", "a": "this verweist auf das aktuelle Objekt. Nötig wenn Parameter und Feld gleich heißen: this.name = name; — ohne this würde der Parameter sich selbst zuweisen.", "h": "Aktuelles Objekt unterscheiden"}, {"q": "Welchen Unterschied macht es ob ein Konstruktor public oder private ist?", "a": "public: Jeder kann Objekte erstellen. private: Kein Objekt von außen erstellbar — nützlich für Singleton-Pattern oder Factory-Methoden die die Erstellung kontrollieren.", "h": "Wer darf Objekte erstellen?"}],
  "encap": [{"q": "Nenne die vier Zugriffsmodifikatoren von am eingeschränktesten bis am offensten.", "a": "private (nur die Klasse) → package-private/default (Paket) → protected (Paket + Unterklassen) → public (überall).", "h": "private → default → protected → public"}, {"q": "Warum soll man Felder private machen statt public?", "a": "Schutz vor ungültigen Werten (Setter kann validieren), Kapselung der Implementierung (Interna können sich ändern ohne API zu brechen), kontrollierter Zugriff.", "h": "Kontrolle, Schutz, Flexibilität"}, {"q": "Was ist die JavaBeans-Namenskonvention für Getter bei boolean-Feldern?", "a": "isXxx() statt getXxx(). Also: isAktiv(), isAngemeldet(), isValid() — nicht getAktiv(). Das ist eine Konvention die Frameworks wie Spring erwarten.", "h": "is statt get"}],
  "inherit": [{"q": "Was macht super() im Konstruktor einer Unterklasse?", "a": "Ruft den Konstruktor der Elternklasse auf. Muss die ERSTE Anweisung im Konstruktor sein. Java fügt automatisch super() ein wenn kein expliziter Aufruf vorhanden und die Elternklasse einen No-Args-Konstruktor hat.", "h": "Eltern-Konstruktor, erste Zeile"}, {"q": "Warum sollte man @Override immer schreiben?", "a": "Compiler-Schutz: wenn der Methodenname einen Tippfehler hat oder die Signatur nicht übereinstimmt, gibt es sofort einen Compilerfehler. Ohne @Override würde einfach eine neue Methode erstellt — stiller Bug.", "h": "Schutz vor Tippfehlern"}, {"q": "Von welcher Klasse erben alle Java-Klassen automatisch?", "a": "Von java.lang.Object. Sie hat Methoden wie toString(), equals(), hashCode() und clone(). Deshalb kann man auf JEDES Objekt toString() aufrufen.", "h": "Die Wurzel aller Klassen"}],
  "poly": [{"q": "Was ist der Unterschied zwischen Overriding und Overloading?", "a": "Overriding: Unterklasse überschreibt eine geerbte Methode mit @Override (gleiche Signatur, anderes Verhalten). Overloading: gleicher Name, andere Parameter in derselben Klasse. Overriding ist Laufzeit-, Overloading Compile-Zeit-Polymorphismus.", "h": "Unterklasse vs. gleiche Klasse"}, {"q": "Was ist Upcasting? Ist es sicher?", "a": "Unterklasse als Oberklasse speichern: Tier t = new Hund(); — immer sicher, automatisch. Der Hund 'ist ein' Tier — kein Datenverlust, aber nur Tier-Methoden direkt sichtbar.", "h": "Kind als Elternteil speichern"}, {"q": "Wie prüfst du sicher den Typ eines Objekts vor dem Downcasting (Java 16+)?", "a": "if (tier instanceof Hund hund) { hund.bellen(); } — Pattern Matching: prüft UND castet in einem. Sicherer als: if (tier instanceof Hund) { ((Hund)tier).bellen(); }", "h": "instanceof mit Pattern Matching"}],
  "abstract": [{"q": "Was ist der Unterschied zwischen einer abstrakten und einer normalen Klasse?", "a": "Abstrakte Klasse kann nicht mit new instanziiert werden. Kann abstrakte Methoden haben (ohne Implementierung). Unterklassen müssen alle abstrakten Methoden implementieren — sonst Compilerfehler.", "h": "Kein new, abstrakte Methoden zwingen Unterklassen"}, {"q": "Wann nimmt man eine abstrakte Klasse, wann ein Interface?", "a": "Abstrakte Klasse: gemeinsame Felder, gemeinsame Implementierung, enge 'ist-ein' Beziehung (Tier → Hund). Interface: nur Verhalten (Fähigkeiten), mehrere unverwandte Klassen, Mehrfach-Implementierung.", "h": "Zustand vs. Verhalten"}, {"q": "Kann eine abstrakte Klasse einen Konstruktor haben?", "a": "Ja! Obwohl man sie nicht direkt instanziieren kann, wird der Konstruktor über super() in der Unterklasse aufgerufen. Nützlich um gemeinsame Felder zu initialisieren.", "h": "Für Unterklassen-Konstruktoren"}],
  "interfaces": [{"q": "Was ist eine default-Methode in einem Interface (Java 8+)?", "a": "Eine Methode im Interface mit Implementierung (default-Schlüsselwort). Erlaubt Interfaces zu erweitern ohne alle implementierenden Klassen anzupassen. Klassen können sie überschreiben.", "h": "Implementierung im Interface"}, {"q": "Was ist der Unterschied zwischen extends und implements?", "a": "extends: Klasse erbt von einer anderen Klasse ODER Interface erweitert Interface. implements: Klasse implementiert ein Interface. Eine Klasse kann nur eine Klasse extenden aber mehrere Interfaces implementieren.", "h": "Vererbung vs. Implementierung"}, {"q": "Was ist ein funktionales Interface (@FunctionalInterface)?", "a": "Ein Interface mit genau einer abstrakten Methode. Kann als Lambda-Ziel verwendet werden. @FunctionalInterface ist optional aber empfohlen — der Compiler prüft es. Beispiel: Runnable, Comparator.", "h": "Genau eine abstrakte Methode = Lambda-fähig"}],
  "enums": [{"q": "Welchen Vorteil haben Enums gegenüber int-Konstanten (int MONTAG = 1)?", "a": "Typsicherheit: Der Compiler erlaubt nur gültige Enum-Werte. Mit int könnte man 99 übergeben — kein Fehler. Enums sind selbst-dokumentierend, haben Methoden (values(), ordinal()) und können eigene Methoden haben.", "h": "Typsicherheit und Lesbarkeit"}, {"q": "Wie rufst du alle Werte eines Enums in einer Schleife ab?", "a": "for (Wochentag tag : Wochentag.values()) { ... } — values() gibt ein Array aller Enum-Konstanten zurück. ordinal() gibt den Index (0-basiert), name() den Namen als String.", "h": "values() gibt ein Array zurück"}, {"q": "Kann ein Enum Felder und Methoden haben?", "a": "Ja! Enums sind spezielle Klassen. Sie können Felder, Konstruktoren (immer private) und Methoden haben. Der Konstruktor wird beim Definieren der Konstanten aufgerufen: ERDE(5.976e+24, 6.37814e6).", "h": "Enum = spezielle Klasse"}],
  "records": [{"q": "Was generiert ein Record automatisch?", "a": "Konstruktor mit allen Feldern, Getter (ohne get-Präfix: punkt.x() statt punkt.getX()), equals() (Wertvergleich!), hashCode() und toString(). Alle Felder sind final (immutable).", "h": "5 Dinge automatisch"}, {"q": "Was ist der Unterschied zwischen record Punkt(int x, int y) {} und einer normalen Klasse?", "a": "Record: eine Zeile, immutable (final Felder), Getter ohne get, equals/hashCode/toString automatisch. Normale Klasse: viele Zeilen Boilerplate, mutable wenn gewünscht, alles manuell.", "h": "Boilerplate vs. kompakt"}, {"q": "Wann sollte man Records verwenden, wann normale Klassen?", "a": "Records: unveränderliche Datenbehälter (Koordinaten, DTOs, API-Responses, Value Objects). Normale Klassen: wenn Zustand sich ändern soll, Vererbung gebraucht wird, oder komplexe Logik nötig ist.", "h": "Immutable Daten vs. veränderbarer Zustand"}],
  "nested": [{"q": "Was ist der Unterschied zwischen einer statischen und einer nicht-statischen inneren Klasse?", "a": "Statisch: kein Zugriff auf Instanzfelder der äußeren Klasse, kein äußeres Objekt nötig. Nicht-statisch (innere Instanzklasse): Zugriff auf alle Felder der äußeren Klasse, braucht äußeres Objekt.", "h": "Mit oder ohne Zugriff auf äußere Instanz"}, {"q": "Warum werden anonyme Klassen heute meist durch Lambdas ersetzt?", "a": "Lambdas sind kürzer und lesbarer für funktionale Interfaces (eine Methode). Anonyme Klassen sind nur noch sinnvoll wenn mehrere Methoden überschrieben werden oder Zustand gebraucht wird.", "h": "Kürzer für Single-Method-Interfaces"}, {"q": "Für welches Design Pattern werden statische innere Klassen typischerweise verwendet?", "a": "Das Builder-Pattern: Person.Builder ist eine statische innere Klasse von Person. So ist der Builder logisch mit der Klasse verbunden, ohne Zugriff auf Instanzfelder zu brauchen.", "h": "Builder-Pattern"}],
  "generics": [{"q": "Was ist der Vorteil von List<String> gegenüber einer rohen List?", "a": "Typsicherheit zur Compile-Zeit: List<String> akzeptiert nur Strings, kein Cast nötig beim Lesen. Rohe List nimmt alles — ClassCastException erst zur Laufzeit möglich.", "h": "Compile-Zeit statt Laufzeit-Fehler"}, {"q": "Was bedeutet <T extends Number> bei einer generischen Methode?", "a": "T muss Number oder eine Unterklasse davon sein (Integer, Double, Long...). So kann man Number-Methoden wie doubleValue() auf T aufrufen. Ohne extends könnte T alles sein — keine Methoden garantiert.", "h": "Eingeschränkter Typparameter"}, {"q": "Was ist der Diamond-Operator <> (Java 7+)?", "a": "Ermöglicht Typinferenz: new ArrayList<String>() kann als new ArrayList<>() geschrieben werden. Der Compiler erkennt den Typ aus der Deklaration. Weniger Wiederholung.", "h": "Typ muss nicht wiederholt werden"}],
  "collections": [{"q": "Was ist der Unterschied zwischen ArrayList und LinkedList?", "a": "ArrayList: schneller Zugriff per Index (O(1)), langsamer bei Einfügen/Löschen in der Mitte. LinkedList: langsamer Zugriff per Index (O(n)), schneller bei Einfügen/Löschen am Anfang/Ende. In der Praxis: fast immer ArrayList.", "h": "Index-Zugriff vs. Einfügen-Performance"}, {"q": "Wann nimmst du HashSet, wann LinkedHashSet, wann TreeSet?", "a": "HashSet: schnellste, keine Reihenfolge. LinkedHashSet: Einfügereihenfolge bleibt erhalten. TreeSet: automatisch sortiert (alphabetisch/natürliche Ordnung). Alle: keine Duplikate.", "h": "Keine Ordnung / Einfügeordnung / Sortiert"}, {"q": "Wie entfernst du sicher Elemente aus einer Liste während du sie durchläufst?", "a": "Iterator.remove() verwenden: Iterator<String> it = liste.iterator(); while(it.hasNext()) { if(Bedingung) it.remove(); }. Niemals liste.remove() in einer for-each-Schleife — ConcurrentModificationException!", "h": "Iterator.remove() statt Collection.remove()"}],
  "maps": [{"q": "Was gibt map.get(key) zurück wenn der Schlüssel nicht existiert?", "a": "null — kein Fehler, keine Exception. Deshalb immer getOrDefault(key, standardwert) verwenden um NullPointerException zu vermeiden. containsKey() prüft ob ein Schlüssel existiert.", "h": "null — also immer getOrDefault verwenden"}, {"q": "Was ist der Unterschied zwischen HashMap, LinkedHashMap und TreeMap?", "a": "HashMap: schnellste, keine garantierte Reihenfolge. LinkedHashMap: Einfügereihenfolge bleibt erhalten. TreeMap: automatisch nach Key sortiert. Alle: Schlüssel müssen eindeutig sein.", "h": "Keine / Einfüge- / Sortierte Reihenfolge"}, {"q": "Wie iterierst du über alle Key-Value-Paare einer Map?", "a": "map.entrySet().forEach((eintrag) -> { eintrag.getKey(); eintrag.getValue(); }); oder for (Map.Entry<K,V> e : map.entrySet()). Alternativ: map.forEach((k, v) -> ...).", "h": "entrySet() oder forEach()"}],
  "iterator": [{"q": "Was ist der Unterschied zwischen Iterator.remove() und List.remove()?", "a": "Iterator.remove() ist sicher während der Iteration — entfernt das zuletzt von next() zurückgegebene Element. List.remove() in einer for-each-Schleife führt zu ConcurrentModificationException.", "h": "Sicher vs. Exception"}, {"q": "Was muss ein Objekt implementieren um in einer for-each-Schleife verwendbar zu sein?", "a": "Das Iterable<T>-Interface mit der Methode iterator(). Diese gibt einen Iterator<T> zurück. Die for-each-Schleife ruft intern iterator() auf.", "h": "Iterable-Interface"}, {"q": "Was ist ein ListIterator und was kann er mehr als ein normaler Iterator?", "a": "ListIterator kann in beide Richtungen navigieren (hasPrevious(), previous()), den aktuellen Index abfragen und Elemente ersetzen (set()) oder einfügen (add()) während der Iteration.", "h": "Bidirektional + mehr Operationen"}],
  "exceptions": [{"q": "Was ist der Unterschied zwischen checked und unchecked Exceptions?", "a": "Checked (z.B. IOException): Compiler zwingt zur Behandlung (throws oder catch). Unchecked/RuntimeException (z.B. NullPointerException): kein Zwang, können aber sollten behandelt werden. Error (z.B. OutOfMemoryError): nicht abfangen.", "h": "Compiler-Zwang vs. optional"}, {"q": "Was macht try-with-resources und wann sollte man es verwenden?", "a": "Schließt Ressourcen automatisch nach dem try-Block — auch bei Exceptions. Verwenden bei allem was AutoCloseable implementiert: Scanner, Dateistreams, Datenbankverbindungen. Verhindert Resource Leaks.", "h": "AutoCloseable automatisch schließen"}, {"q": "Was soll eine eigene Exception-Klasse von RuntimeException oder Exception erben?", "a": "Von RuntimeException (unchecked) wenn der Aufrufer nicht unbedingt damit rechnen muss (Programmierfehler wie IllegalArgumentException). Von Exception (checked) wenn der Aufrufer explizit reagieren muss (externe Ressourcen, IO).", "h": "Programmierfehler vs. externe Fehler"}],
  "functional": [{"q": "Welche vier wichtigsten funktionalen Interfaces gibt es und was machen sie?", "a": "Predicate<T>: T → boolean (Bedingung). Function<T,R>: T → R (Umwandlung). Consumer<T>: T → void (Seiteneffekt). Supplier<T>: () → T (Lieferung ohne Parameter).", "h": "Prüfen / Umwandeln / Verbrauchen / Liefern"}, {"q": "Was macht Predicate.and() und wie unterscheidet es sich von &&?", "a": "Predicate.and(anderesBedingung) kombiniert zwei Predicate-Objekte zu einem neuen: p1.and(p2) entspricht x -> p1.test(x) && p2.test(x). Erlaubt Komposition von Bedingungen als Objekte.", "h": "Predicate-Objekte kombinieren"}, {"q": "Wann würde man Supplier<T> verwenden?", "a": "Lazy Initialisierung: der Wert wird erst berechnet wenn er wirklich gebraucht wird. Optional.orElseGet(Supplier) statt orElse(Wert) — bei teueren Berechnungen. Factory-Methoden: Supplier<List> = ArrayList::new.", "h": "Lazy = erst berechnen wenn nötig"}],
  "lambdas": [{"q": "Schreibe den Lambda-Ausdruck für: eine Methode die einen String nimmt und seine Länge zurückgibt.", "a": "s -> s.length() — oder ausführlicher: (String s) -> { return s.length(); }. Als Function<String, Integer>: Function<String, Integer> laenge = s -> s.length();", "h": "Kurz: s -> s.length()"}, {"q": "Was ist der Unterschied zwischen einem Lambda und einer anonymen Klasse?", "a": "Lambda: kürzer, nur für funktionale Interfaces (1 Methode), kein eigenes this (this = umgebende Klasse). Anonyme Klasse: mehrere Methoden möglich, eigenes this, kann Zustand haben.", "h": "Kürzer, aber nur 1 Methode"}, {"q": "Auf welche Variablen kann ein Lambda aus dem umgebenden Scope zugreifen?", "a": "Nur auf effectively final Variablen — Variablen die nach der Zuweisung nicht mehr geändert werden (auch ohne das Schlüsselwort final). Änderung nach Lambda-Erstellung: Compilerfehler.", "h": "Effectively final"}],
  "methodref": [{"q": "Welche vier Typen von Method References gibt es?", "a": "1. Statisch: Math::sqrt. 2. Instanz eines Objekts: System.out::println. 3. Instanz eines Typs: String::toUpperCase. 4. Konstruktor: ArrayList::new.", "h": "Statisch / Objekt / Typ / Konstruktor"}, {"q": "Wann kann ein Lambda durch eine Method Reference ersetzt werden?", "a": "Wenn das Lambda AUSSCHLIESSLICH eine Methode aufruft und keine eigene Logik hat. s -> s.toUpperCase() → String::toUpperCase. s -> System.out.println(s) → System.out::println.", "h": "Nur wenn keine eigene Logik"}, {"q": "Was bedeutet String::toUpperCase als Method Reference?", "a": "Instanzmethode eines Typs: das erste Argument wird zum Objekt auf dem die Methode aufgerufen wird. s -> s.toUpperCase() entspricht String::toUpperCase. In map(String::toUpperCase): jeder String ruft toUpperCase() auf sich selbst auf.", "h": "Erstes Argument = Objekt"}],
  "streams": [{"q": "Was ist der Unterschied zwischen Intermediate und Terminal Operations?", "a": "Intermediate (filter, map, sorted): träge (lazy), werden nicht sofort ausgeführt, geben Stream zurück. Terminal (collect, forEach, count): lösen die Verarbeitung aus, geben kein Stream zurück. Ohne Terminal passiert nichts.", "h": "Lazy vs. auslösend"}, {"q": "Was ist der Unterschied zwischen map() und flatMap()?", "a": "map(): wandelt jedes Element in ein anderes um (1:1). flatMap(): wandelt jedes Element in einen Stream um und 'flacht' ihn ab (1:n). Für z.B. Listen von Listen: List<List<String>> → Stream<String>.", "h": "1:1 vs. 1:n mit Abflachung"}, {"q": "Wie gruppierst du eine Liste von Strings nach ihrer Länge mit Streams?", "a": "liste.stream().collect(Collectors.groupingBy(String::length)); — gibt Map<Integer, List<String>> zurück. groupingBy() ist der wichtigste Collector nach toList().", "h": "Collectors.groupingBy()"}],
  "optional": [{"q": "Warum ist optional.get() gefährlich und was sollte man stattdessen verwenden?", "a": "optional.get() ohne isPresent()-Check wirft NoSuchElementException wenn leer — genauso gefährlich wie NullPointerException. Besser: orElse(), orElseGet(), orElseThrow(), ifPresent() oder map().", "h": "Immer mit Fallback arbeiten"}, {"q": "Was ist der Unterschied zwischen orElse() und orElseGet()?", "a": "orElse(wert): der Wert wird IMMER berechnet, auch wenn Optional nicht leer ist. orElseGet(supplier): der Supplier wird nur aufgerufen wenn Optional leer ist (lazy). Bei teuren Berechnungen immer orElseGet().", "h": "Eager vs. Lazy"}, {"q": "Wofür ist Optional gedacht und wofür nicht?", "a": "Optional ist für Rückgabewerte von Methoden die keinen Wert haben können. NICHT für: Methodenparameter (lieber Overloading), Felder (erhöht Komplexität), Collections (leere Collection statt Optional<Collection>).", "h": "Rückgabewerte ja, Parameter/Felder nein"}],
  "datetime": [{"q": "Was ist der Unterschied zwischen LocalDate, LocalTime und LocalDateTime?", "a": "LocalDate: nur Datum (2024-04-10), kein Uhrzeit. LocalTime: nur Uhrzeit (14:35), kein Datum. LocalDateTime: beides zusammen. Alle ohne Zeitzone — für Zeitzonenwechsel ZonedDateTime.", "h": "Datum / Zeit / Beides"}, {"q": "Warum ist java.time besser als die alte Date-Klasse?", "a": "Immutable (thread-sicher), klar benannt, intuitiv zu bedienen, trennt Datum/Zeit/Zeitzone sauber. Date war mutable, Monate 0-basiert (Januar=0!), keine Zeitzonentrennung, schwer zu formatieren.", "h": "Immutable, klar, intuitiv"}, {"q": "Wie berechnest du die Anzahl Tage zwischen zwei LocalDates?", "a": "long tage = ChronoUnit.DAYS.between(datum1, datum2); — oder Period.between() für Jahre/Monate/Tage zusammen. Period.between(datum1, datum2).getDays() gibt nur die Tage-Komponente.", "h": "ChronoUnit.DAYS.between()"}],
  "fileio": [{"q": "Was ist der einfachste Weg einen Text in eine Datei zu schreiben (Java 11+)?", "a": "Files.writeString(Path.of(\"datei.txt\"), \"Inhalt\"); — erstellt oder überschreibt die Datei. Zum Anhängen: Files.writeString(pfad, text, StandardOpenOption.APPEND);", "h": "Files.writeString()"}, {"q": "Warum sollte man Files.lines() statt Files.readAllLines() für große Dateien verwenden?", "a": "Files.readAllLines() lädt die gesamte Datei in den RAM. Files.lines() gibt einen Stream zurück der die Datei zeilenweise liest — speichereffizient für große Dateien (Gigabytes).", "h": "Stream vs. alle auf einmal"}, {"q": "Welche Exception muss bei Datei-I/O immer behandelt werden und warum?", "a": "IOException (checked Exception) — Compiler erzwingt Behandlung. Mögliche Ursachen: Datei nicht gefunden, keine Leserechte, Festplatte voll. try-catch oder throws in der Methodensignatur.", "h": "IOException ist checked"}],
  "threads": [{"q": "Was ist der Unterschied zwischen thread.run() und thread.start()?", "a": "start(): startet einen NEUEN Thread, run() wird in diesem neuen Thread ausgeführt. run(): führt die run()-Methode im AKTUELLEN Thread aus — kein neuer Thread, kein Parallelismus!", "h": "Neuer Thread vs. aktueller Thread"}, {"q": "Was ist eine Race Condition und wie verhindert man sie?", "a": "Race Condition: mehrere Threads lesen und schreiben gleichzeitig eine Variable — Ergebnis unvorhersehbar. Verhindern: synchronized-Methode/-Block oder AtomicInteger/AtomicLong verwenden.", "h": "Gleichzeitiger Zugriff auf shared state"}, {"q": "Was macht ExecutorService.shutdown() und warum ist es wichtig?", "a": "shutdown(): nimmt keine neuen Aufgaben mehr an, wartet bis alle laufenden fertig sind. Ohne shutdown läuft die JVM nicht beendet obwohl main() fertig ist — Thread-Pool-Threads sind keine Daemon-Threads.", "h": "Aufräumen nach Parallelarbeit"}],
  "jdk": [{"q": "Was ist der Unterschied zwischen JDK, JRE und JVM?", "a": "JDK: Entwicklungswerkzeuge (Compiler, Debugger) + JRE. JRE: Laufzeitbibliotheken + JVM. JVM: führt Bytecode aus, ist plattformspezifisch. Entwickler brauchen JDK, Endnutzer nur JRE.", "h": "Entwickeln / Ausführen / Motor"}, {"q": "Was ist Bytecode und warum macht er Java plattformunabhängig?", "a": "Bytecode ist der kompilierte Zwischencode (.class-Datei) — weder Quellcode noch nativer Maschinencode. Die JVM übersetzt ihn zur Laufzeit für das jeweilige Betriebssystem. Write once, run anywhere.", "h": "Plattformunabhängiger Zwischencode"}, {"q": "Was sind LTS-Versionen von Java und welche sind wichtig?", "a": "Long Term Support: mehrere Jahre offiziell unterstützt. Wichtig: Java 8, 11, 17, 21. In der Industrie am häufigsten: Java 11 und 17. Java 21 wird Standard. Zwischen-Versionen (9, 10, 12-16, 18-20) kaum im Einsatz.", "h": "Langzeit-Support alle 2-3 Jahre"}],
  "ide": [{"q": "Welcher Shortcut formatiert Code in IntelliJ IDEA automatisch?", "a": "Strg+Alt+L (Windows/Linux) bzw. Cmd+Alt+L (Mac). Sollte man nach jeder größeren Änderung ausführen. Strg+Alt+O entfernt außerdem ungenutzte Imports.", "h": "Strg+Alt+L"}, {"q": "Was macht Alt+Enter in IntelliJ und wann verwendet man es?", "a": "Öffnet den Quick Fix / Intention Actions Dialog. Bei roter Wellenlinie: Fehler beheben, Import hinzufügen. Bei gelber Wellenlinie: Code verbessern, Refactoring. Der wichtigste Shortcut überhaupt.", "h": "Der universelle Problemlöser-Shortcut"}, {"q": "Wie startet man den Debugger in IntelliJ und wie setzt man einen Breakpoint?", "a": "Breakpoint: links neben die Zeilennummer klicken (roter Punkt). Debugger starten: Shift+F9. F8 = Step Over, F7 = Step Into, F9 = weiter bis nächster Breakpoint.", "h": "Shift+F9 für Debugger"}],
  "git": [{"q": "Was ist der Unterschied zwischen git add und git commit?", "a": "git add: Änderungen in die Staging-Area nehmen (vorbereiten). git commit: Snapshot der gestagten Änderungen dauerhaft speichern. Zweistufiger Prozess: erst stagen, dann committen.", "h": "Staging-Area → Repository"}, {"q": "Was macht git pull und was ist der Unterschied zu git fetch?", "a": "git pull = git fetch + git merge: holt Änderungen vom Remote und integriert sie direkt. git fetch: holt Änderungen aber integriert sie nicht — man kann sie erst prüfen.", "h": "Holen + Mergen vs. nur Holen"}, {"q": "Was sind gute Commit-Message Konventionen?", "a": "Format: typ: kurze Beschreibung. Typen: feat (neues Feature), fix (Bug), docs (Dokumentation), refactor, test, chore. Präsens: 'feat: Login implementieren', nicht 'Login implementiert'. Max 50 Zeichen.", "h": "feat/fix/docs + Präsens + kurz"}],
  "github": [{"q": "Was ist ein Pull Request und wann erstellt man ihn?", "a": "Pull Request (PR): Antrag einen Feature-Branch in einen anderen Branch (meist main) zu mergen. Erstellt wenn die Arbeit am Feature fertig ist — erlaubt Code Review durch Kollegen vor dem Merge.", "h": "Code Review vor dem Merge"}, {"q": "Was ist der typische Branch-Workflow in einem Team?", "a": "main bleibt stabil. Für jede Aufgabe: git switch -c feature/aufgabe. Entwickeln + committen. Branch pushen. Pull Request erstellen. Review. Merge in main. Branch löschen.", "h": "Nie direkt auf main — immer Feature-Branch"}, {"q": "Was ist GitHub Actions und wofür wird es verwendet?", "a": "CI/CD-Plattform von GitHub. Automatisch Tests ausführen bei jedem Push, Code-Qualität prüfen, Deployment automatisieren. .github/workflows/java.yml konfiguriert die Pipeline.", "h": "Automatische Tests und Deployments"}],
  "maven": [{"q": "Was sind groupId, artifactId und version in der pom.xml?", "a": "groupId: Organisationsdomäne umgekehrt (de.meinfirma.projekt). artifactId: Projektname (mein-projekt). version: Versionsnummer (1.0.0-SNAPSHOT). Zusammen identifizieren sie das Projekt eindeutig im Maven-Ökosystem.", "h": "Eindeutige Projektidentifikation"}, {"q": "Was bedeutet der scope test bei einer Dependency?", "a": "Die Dependency ist nur für Tests verfügbar (src/test), nicht im finalen JAR/WAR enthalten. Typisch für JUnit, Mockito. Andere Scopes: compile (Standard, immer), runtime (nur Laufzeit), provided (vom Server bereitgestellt).", "h": "Nur für Tests, nicht im Produkt"}, {"q": "Was macht mvn clean install?", "a": "clean: target/-Ordner löschen (alte Kompilate entfernen). install: kompilieren, testen, JAR erstellen und ins lokale Maven-Repository (~/.m2) installieren. Häufigste Kombination im Entwickleralltag.", "h": "Aufräumen + vollständig bauen"}],
  "gradle": [{"q": "Was ist der Unterschied zwischen implementation und testImplementation in Gradle?", "a": "implementation: Dependency ist zur Laufzeit verfügbar (Produktivcode). testImplementation: nur für Tests (JUnit, Mockito). Kein Äquivalent zu Maven's scope — Gradle trennt Konfigurationen klarer.", "h": "Produktiv vs. nur Tests"}, {"q": "Warum sollte man gradlew statt gradle verwenden?", "a": "gradlew (Gradle Wrapper) stellt sicher dass alle Entwickler und der CI-Server dieselbe Gradle-Version verwenden. Ohne Wrapper könnte jeder eine andere installierte Version haben — unterschiedliche Ergebnisse.", "h": "Reproduzierbare Builds im Team"}, {"q": "Was ist der Vorteil von Gradle gegenüber Maven?", "a": "Schneller durch inkrementellen Build und Build-Cache (nur geänderte Teile neu kompilieren). Flexibler durch echte Programmiersprache (Groovy/Kotlin) statt XML. Standard für Android. Nachteile: steilere Lernkurve.", "h": "Schneller + flexibler"}],
  "debug": [{"q": "Was ist der Unterschied zwischen Step Over (F8) und Step Into (F7)?", "a": "Step Over: nächste Zeile ausführen, Methodenaufrufe werden NICHT betreten (ausgeführt als ganzes). Step Into: wenn die nächste Zeile einen Methodenaufruf hat, in diese Methode reinspringen.", "h": "Methode ausführen vs. rein"}, {"q": "Was ist ein bedingter Breakpoint und wann ist er nützlich?", "a": "Breakpoint der nur anhält wenn eine Bedingung erfüllt ist (z.B. i == 100). Nützlich wenn der Bug nur bei bestimmten Werten auftritt. Rechtsklick auf Breakpoint → Condition eingeben.", "h": "Nur bei bestimmten Werten anhalten"}, {"q": "Was sind die häufigsten Exception-Typen beim Debuggen und ihre typischen Ursachen?", "a": "NullPointerException: Variable ist null. ArrayIndexOutOfBoundsException: Index >= length. ClassCastException: falscher Cast. NumberFormatException: parseInt(\"abc\"). StackOverflowError: endlose Rekursion.", "h": "null / Index / Cast / Parse / Rekursion"}],
  "sql-basics": [{"q": "Was bedeutet CRUD und welche SQL-Befehle gehören dazu?", "a": "Create=INSERT INTO, Read=SELECT, Update=UPDATE, Delete=DELETE. Die vier Grundoperationen jeder Datenbankanwendung.", "h": "4 Grundoperationen"}, {"q": "Was passiert wenn du UPDATE oder DELETE ohne WHERE-Klausel ausführst?", "a": "ALLE Zeilen der Tabelle werden geändert/gelöscht! UPDATE kunden SET alter=0; setzt das Alter ALLER Kunden auf 0. Immer WHERE-Klausel prüfen bevor UPDATE/DELETE ausgeführt wird.", "h": "Alle Zeilen betroffen — sehr gefährlich!"}, {"q": "Was ist der Unterschied zwischen WHERE und HAVING?", "a": "WHERE filtert VOR der Gruppierung (auf einzelne Zeilen). HAVING filtert NACH der Gruppierung (auf Gruppen-Ergebnisse). HAVING wird immer mit GROUP BY verwendet.", "h": "Vor vs. nach GROUP BY"}],
  "sql-joins": [{"q": "Was ist der Unterschied zwischen INNER JOIN und LEFT JOIN?", "a": "INNER JOIN: nur Zeilen die in BEIDEN Tabellen einen Match haben. LEFT JOIN: ALLE Zeilen der linken Tabelle, auch wenn kein Match rechts (dann NULL). RIGHT JOIN: analog aber rechts.", "h": "Nur Matches vs. alle Links + Matches"}, {"q": "Was ist ein Fremdschlüssel (FOREIGN KEY) und wozu dient er?", "a": "Spalte die auf den Primärschlüssel einer anderen Tabelle verweist. Stellt referentielle Integrität sicher: verhindert z.B. eine Bestellung für einen nicht existierenden Kunden.", "h": "Referenz auf andere Tabelle + Integritätssicherung"}, {"q": "Wie verbindest du drei Tabellen in einer SQL-Abfrage?", "a": "SELECT ... FROM tabelle1 JOIN tabelle2 ON t1.id = t2.t1_id JOIN tabelle3 ON t2.id = t3.t2_id; — JOINs werden nacheinander aufgebaut.", "h": "Mehrere JOIN-Klauseln nacheinander"}],
  "jdbc": [{"q": "Was ist SQL-Injection und wie verhindert PreparedStatement sie?", "a": "SQL-Injection: Angreifer schleust SQL-Code über Eingabe ein. PreparedStatement trennt SQL-Struktur von Daten — ? werden als Literale behandelt, nicht als SQL-Code. String-Konkatenation niemals verwenden!", "h": "? als Platzhalter statt String-Konkatenation"}, {"q": "Was ist eine JDBC-Connection und warum muss man sie schließen?", "a": "Connection ist eine Datenbankverbindung — ein begrenztes Betriebssystemresource. Nicht geschlossene Verbindungen führen zu Resource Leaks und schließlich zum Connection-Pool-Erschöpfung. try-with-resources verwendet.", "h": "Begrenzte Ressource — immer schließen"}, {"q": "Was ist der Unterschied zwischen Statement und PreparedStatement?", "a": "Statement: SQL-String direkt ausführen — SQL-Injection möglich, bei Wiederholung langsamer. PreparedStatement: SQL vorcompiliert, Parameter mit ? — sicher gegen SQL-Injection, schneller bei Wiederholung.", "h": "Sicher + schneller"}],
  "jpa": [{"q": "Was machen die JPA-Annotationen @Entity, @Id und @GeneratedValue?", "a": "@Entity: diese Klasse entspricht einer Datenbanktabelle. @Id: dieses Feld ist der Primärschlüssel. @GeneratedValue(strategy=IDENTITY): Datenbank generiert den Wert automatisch (AUTO_INCREMENT).", "h": "Tabelle / Schlüssel / Auto-Increment"}, {"q": "Was ist der Unterschied zwischen @OneToMany und @ManyToOne?", "a": "@ManyToOne: Viele Objekte → Ein Objekt (Bestellung → Kunde). @OneToMany: Ein Objekt → Viele Objekte (Kunde → Bestellungen). Beide Seiten einer bidirektionalen Beziehung.", "h": "Richtung der Beziehung"}, {"q": "Was ist der Vorteil von Spring Data JPA gegenüber direktem EntityManager?", "a": "Spring Data JPA generiert Implementierungen automatisch: findByName() → SELECT WHERE name = ?. Kein Boilerplate-Code. JpaRepository gibt save, findById, findAll, delete kostenlos. @Query für komplexe Abfragen.", "h": "Automatisch generierte Implementierungen"}],
  "spring-core": [{"q": "Was ist Dependency Injection (DI) und welchen Vorteil hat es?", "a": "Objekte werden nicht selbst erstellt (new), sondern vom Framework bereitgestellt und injiziert. Vorteil: lose Kopplung, bessere Testbarkeit (Mocks injizierbar), einfachere Konfiguration.", "h": "Framework erstellt und verbindet Objekte"}, {"q": "Was ist der Unterschied zwischen @Component, @Service und @Repository?", "a": "Alle sind Spring-Beans (@Component). @Service: semantisch für Business-Logik. @Repository: semantisch für Datenbankzugriff (fügt Exception-Translation hinzu). Unterschied ist hauptsächlich semantisch/dokumentarisch.", "h": "Alle sind Beans — semantischer Unterschied"}, {"q": "Warum wird Konstruktor-Injection gegenüber Feld-Injection (@Autowired am Feld) bevorzugt?", "a": "Felder können final sein (Immutabilität). Keine Spring-Abhängigkeit im Test (normales new möglich). Zyklische Abhängigkeiten werden sofort erkannt. Code ist klarer und testbarer.", "h": "final + testbar ohne Spring"}],
  "springboot": [{"q": "Was macht @SpringBootApplication?", "a": "Ist eine Meta-Annotation aus @Configuration (Spring-Konfiguration), @EnableAutoConfiguration (automatische Konfiguration) und @ComponentScan (sucht Beans im Paket). Die 'Alles-in-einem' Annotation für Spring Boot.", "h": "3 Annotationen in einer"}, {"q": "Was ist Auto-Configuration in Spring Boot?", "a": "Spring Boot analysiert den Classpath und konfiguriert automatisch passende Beans. H2 im Classpath → DataSource konfigurieren. Jackson im Classpath → JSON-Konvertierung. Überschreibbar durch eigene @Bean-Definitionen.", "h": "Automatisch basierend auf Classpath"}, {"q": "Wozu dient application.properties/application.yml?", "a": "Externe Konfiguration ohne Code-Änderung: Port, Datenbankverbindung, Logging-Level, eigene Werte. Getrennte Dateien für Profile (application-dev.properties, application-prod.properties) möglich.", "h": "Externe Konfiguration ohne Code-Änderung"}],
  "rest-api": [{"q": "Welche HTTP-Methode und welchen Statuscode verwendet man zum Erstellen einer Ressource?", "a": "POST für die Erstellung, 201 Created als Statuscode. Optional Location-Header mit URL der erstellten Ressource. Nicht 200 OK — das ist für erfolgreiche GET/PUT-Anfragen.", "h": "POST + 201 Created"}, {"q": "Was ist der Unterschied zwischen @PathVariable und @RequestParam?", "a": "@PathVariable: Wert aus dem URL-Pfad: /kunden/{id}. @RequestParam: Wert aus dem Query-String: /kunden?name=Anna. PathVariable für Ressourcen-IDs, RequestParam für Filter und optionale Parameter.", "h": "Pfad vs. Query-String"}, {"q": "Was ist der Unterschied zwischen PUT und PATCH?", "a": "PUT: ersetzt die gesamte Ressource (alle Felder). PATCH: teilweise Aktualisierung (nur geänderte Felder). PUT ist idempotent (mehrfach ausführen = gleiche Wirkung). Für REST APIs ist PATCH oft sinnvoller.", "h": "Komplett ersetzen vs. teilweise ändern"}],
  "spring-data": [{"q": "Wie generiert Spring Data JPA die Implementierung für findByVornameAndAlterGreaterThan()?", "a": "Aus dem Methodennamen: findBy = WHERE, Vorname = vorname-Spalte, And = AND, Alter = alter-Spalte, GreaterThan = >. SQL: SELECT * FROM ... WHERE vorname = ? AND alter > ?. Vollständig automatisch.", "h": "Methodenname wird zu SQL"}, {"q": "Was macht @Transactional und wann braucht man es?", "a": "Alle Datenbankoperationen in der Methode laufen in einer Transaktion. Bei Exception → automatischer Rollback (alle Änderungen rückgängig). Pflicht bei Methoden die Daten ändern (save, delete, update).", "h": "Alles oder nichts — Rollback bei Exception"}, {"q": "Was ist der Unterschied zwischen findById() und getOne()?", "a": "findById(): gibt Optional<T> zurück, Datenbankabfrage sofort. getOne()/getReferenceById(): gibt Proxy zurück, Datenbankabfrage erst bei Zugriff auf Felder (lazy). findById() mit Optional ist für die meisten Fälle besser.", "h": "Sofort laden vs. lazy Proxy"}],
  "spring-val": [{"q": "Was ist der Unterschied zwischen @NotNull, @NotEmpty und @NotBlank?", "a": "@NotNull: darf nicht null sein. @NotEmpty: darf nicht null und nicht leer sein (length > 0). @NotBlank: darf nicht null, nicht leer und nicht nur Leerzeichen sein. Für Strings meist @NotBlank.", "h": "null / leer / Leerzeichen"}, {"q": "Was passiert wenn die Validierung fehlschlägt und kein ExceptionHandler da ist?", "a": "Spring Boot gibt automatisch einen 400 Bad Request zurück mit einer standardisierten Fehlermeldung. Mit @RestControllerAdvice kann man das anpassen um strukturierte JSON-Fehler zurückzugeben.", "h": "400 Bad Request automatisch"}, {"q": "Wo platziert man die Validierungsannotationen und wie aktiviert man sie?", "a": "Annotationen (@NotBlank, @Email etc.) auf die Felder des DTOs/Records. @Valid im Controller-Parameter aktiviert die Prüfung. Ohne @Valid werden die Annotationen ignoriert.", "h": "@Valid aktiviert, Annotationen auf dem DTO"}],
  "spring-sec": [{"q": "Was ist der Unterschied zwischen Authentifizierung und Autorisierung?", "a": "Authentifizierung: Identität prüfen — 'Wer bist du?' (Login mit Username/Passwort). Autorisierung: Rechte prüfen — 'Was darfst du?' (Rolle ADMIN darf löschen, USER nicht).", "h": "Wer bist du? vs. Was darfst du?"}, {"q": "Warum darf man Passwörter niemals im Klartext speichern?", "a": "Bei Datenbankdiebstahl wären alle Passwörter sofort lesbar. BCrypt-Hashing: aus Passwort wird unumkehrbarer Hash. Beim Login: Eingabe hashen und mit gespeichertem Hash vergleichen — nie entschlüsseln.", "h": "Unumkehrbarer Hash statt Klartext"}, {"q": "Was macht permitAll() und was authenticated() in der Security-Konfiguration?", "a": "permitAll(): alle Benutzer dürfen zugreifen (auch nicht eingeloggte). authenticated(): nur eingeloggte Benutzer. hasRole('ADMIN'): nur Benutzer mit ADMIN-Rolle.", "h": "Offen / eingeloggt / Rolle"}],
  "junit": [{"q": "Was ist der Unterschied zwischen @BeforeEach und @BeforeAll?", "a": "@BeforeEach: wird vor JEDEM einzelnen Test ausgeführt. @BeforeAll: wird einmalig vor ALLEN Tests ausgeführt (muss static sein). @BeforeEach für frische Objekte, @BeforeAll für teure Initialisierung.", "h": "Vor jedem vs. einmalig vor allen"}, {"q": "Was ist assertAll() und wann sollte man es verwenden?", "a": "assertAll() führt alle Assertions aus und sammelt ALLE Fehler, statt bei der ersten zu stoppen. Nützlich wenn mehrere Felder eines Objekts geprüft werden — man sieht alle Fehler auf einmal.", "h": "Alle Assertions ausführen, nicht bei erster stoppen"}, {"q": "Was ist ein parametrisierter Test (@ParameterizedTest) und wann ist er nützlich?", "a": "Test der mit verschiedenen Eingabewerten mehrfach ausgeführt wird. @ValueSource für einfache Werte, @CsvSource für Tabellen. Nützlich um viele Grenzfälle zu testen ohne Code-Duplizierung.", "h": "Einmal schreiben, viele Werte testen"}],
  "mockito": [{"q": "Was ist der Unterschied zwischen @Mock und @Spy?", "a": "@Mock: vollständige Fälschung — alle Methoden tun standardmäßig nichts/geben null zurück. @Spy: echtes Objekt, aber einzelne Methoden können überschrieben werden. Spy für partielle Mocks.", "h": "Vollständige Fälschung vs. echtes Objekt mit Overrides"}, {"q": "Was ist verify() in Mockito und was prüft es?", "a": "verify() prüft ob eine Mock-Methode aufgerufen wurde: verify(mock).methode(args). verify(mock, times(2)) für genau 2 Aufrufe, never() für keinen Aufruf. Prüft Interaktion, nicht Ergebnis.", "h": "Wurde die Methode aufgerufen?"}, {"q": "Was ist when().thenReturn() und was ist when().thenThrow()?", "a": "when(mock.methode(args)).thenReturn(wert): definiert Rückgabewert für Methodenaufruf. thenThrow(exception): wirft Exception wenn Methode aufgerufen wird. Für Tests von Exception-Handling.", "h": "Rückgabewert / Exception definieren"}],
  "springtest": [{"q": "Was ist der Unterschied zwischen @SpringBootTest und @WebMvcTest?", "a": "@SpringBootTest: startet kompletten Spring-Kontext inkl. DB. Langsamer, echter Integrationstest. @WebMvcTest: nur Controller-Schicht, Services werden gemockt (@MockBean). Schneller, isolierter.", "h": "Alles vs. nur Controller"}, {"q": "Was ist MockMvc und wie testet man damit einen GET-Endpunkt?", "a": "MockMvc simuliert HTTP-Anfragen ohne echten Server. mockMvc.perform(get(\"/api/kunden\")).andExpect(status().isOk()).andExpect(jsonPath(\"$[0].name\").value(\"Anna\"))", "h": "HTTP-Simulation im Test"}, {"q": "Was macht @DataJpaTest?", "a": "Konfiguriert nur JPA-Schicht: lädt Entities und Repositories, startet H2 In-Memory-Datenbank automatisch, kein Web-Layer. Schnelle Repository-Tests ohne vollständigen Spring-Kontext.", "h": "Nur JPA + H2 — kein Web"}],
  "tdd": [{"q": "Was sind die drei Schritte des TDD-Zyklus?", "a": "1. RED: Test schreiben der fehlschlägt (Klasse/Methode existiert noch nicht). 2. GREEN: minimalen Code schreiben damit Test besteht. 3. REFACTOR: Code verbessern ohne Tests zu brechen. Dann wieder RED.", "h": "Red → Green → Refactor"}, {"q": "Was bedeutet 'minimal' bei GREEN im TDD-Zyklus?", "a": "So wenig Code wie nötig damit der Test besteht — nicht mehr. Keine vorzeitige Verallgemeinerung. Weitere Features kommen durch weitere Tests. Verhindert Over-Engineering.", "h": "Nur das nötigste — nicht mehr"}, {"q": "Welche Vorteile hat TDD gegenüber nachträglichem Testen?", "a": "100% Testabdeckung garantiert (man testet immer zuerst). Besseres Design (testbarer Code ist saubererer Code). Sofortiges Feedback bei Regression. Tests als lebende Dokumentation.", "h": "Abdeckung + Design + Dokumentation"}],
  "cleancode": [{"q": "Was bedeutet DRY (Don't Repeat Yourself) und was ist die Alternative?", "a": "Gleicher Code an mehreren Stellen ist ein Wartungsproblem — eine Änderung muss überall gemacht werden. Alternative: in eine Methode/Klasse extrahieren und wiederverwenden.", "h": "Einmal schreiben, überall verwenden"}, {"q": "Was ist KISS und wie wendet man es auf Methoden an?", "a": "Keep It Simple, Stupid: Einfache Lösung bevorzugen. Methoden kurz halten (max 15-20 Zeilen), einen Zweck verfolgen, beschreibend benennen. Komplexer Code = Wartungsproblem.", "h": "Einfach + kurz + einen Zweck"}, {"q": "Warum sind Kommentare die erklären WAS Code tut oft schlechte Kommentare?", "a": "Wenn man erklären muss was Code tut, ist der Code nicht selbsterklärend. Besser: Code umschreiben damit er verständlich ist (bessere Namen, kleinere Methoden). Kommentare für das WARUM, nicht das WAS.", "h": "Code soll sich selbst erklären"}],
  "solid": [{"q": "Erkläre das Single Responsibility Principle in einem Satz.", "a": "Eine Klasse soll nur einen Grund zur Änderung haben — sie soll nur eine Aufgabe erfüllen. Wenn sich zwei verschiedene Dinge ändern könnten, gehören sie in zwei Klassen.", "h": "Ein Grund zur Änderung"}, {"q": "Was bedeutet 'offen für Erweiterung, geschlossen für Änderung' (Open/Closed)?", "a": "Neues Verhalten soll durch neue Klassen/Interfaces hinzugefügt werden — nicht durch Änderung bestehender. Beispiel: neue Rabattart = neue Klasse, nicht if-else erweitern. Interfaces ermöglichen das.", "h": "Erweitern ohne zu ändern"}, {"q": "Was ist das Dependency Inversion Principle?", "a": "High-Level-Module (BestellService) sollen nicht von Low-Level-Modulen (MySQLRepository) abhängen, sondern beide von Abstraktionen (KundenRepository Interface). Ermöglicht Austauschbarkeit.", "h": "Von Interfaces abhängen, nicht Implementierungen"}],
  "patterns": [{"q": "Was ist das Singleton-Pattern und was ist sein größtes Risiko?", "a": "Garantiert dass genau ein Objekt einer Klasse existiert. Globaler Zugriff über getInstance(). Risiko: globaler Zustand macht Tests schwerer (alle Tests teilen dieselbe Instanz) und kann zu Kopplung führen.", "h": "Eine Instanz, aber: Testprobleme"}, {"q": "Was ist das Builder-Pattern und wann braucht man es?", "a": "Schrittweise Konstruktion komplexer Objekte: new Person.Builder(\"Anna\").email(\"a@t.de\").alter(25).build(). Nötig wenn viele optionale Parameter vorhanden sind — Method Chaining statt Konstruktor mit vielen null-Parametern.", "h": "Viele optionale Parameter lesbar machen"}, {"q": "Was ist der Unterschied zwischen Factory Method und Abstract Factory?", "a": "Factory Method: eine Methode erstellt Objekte (BenachrichtigungsFactory.erstelle('EMAIL')). Abstract Factory: Familie zusammengehöriger Objekte erstellen (UIFactory erstellt Button, Textfeld, Checkbox passend zum OS).", "h": "Ein Objekt vs. Familie von Objekten"}],
  "refactor": [{"q": "Was bedeutet 'Refactoring' und was ändert sich dabei?", "a": "Interne Struktur verbessern ohne beobachtbares Verhalten zu ändern. Was sich ändert: Lesbarkeit, Wartbarkeit, Struktur. Was sich NICHT ändert: Funktionalität, Tests bleiben grün.", "h": "Besser strukturieren ohne Funktionsänderung"}, {"q": "Was ist 'Extract Method' und wann sollte man es anwenden?", "a": "Codeabschnitt in eine eigene Methode auslagern. Anwenden wenn: Code-Block hat einen klaren Zweck, mehrfach vorkommt, Methode zu lang ist, oder ein Kommentar erklärt was ein Block macht.", "h": "Langen Code in Methoden aufteilen"}, {"q": "Was ist die 'Boy Scout Rule' beim Refactoring?", "a": "Hinterlasse den Code sauberer als du ihn vorgefunden hast. Bei jeder Datei die du öffnest: kleine Verbesserungen vornehmen (umbenennen, extrahieren, Kommentar entfernen). Kontinuierliche Verbesserung.", "h": "Immer ein bisschen besser hinterlassen"}],
  "oop-prinzipien": [{"q": "Nenne die vier Hauptprinzipien der OOP und erkläre jedes in einem Satz.", "a": "Kapselung: Daten verstecken, Zugriff kontrollieren. Vererbung: Eigenschaften von Elternklassen übernehmen. Polymorphismus: gleiche Schnittstelle, unterschiedliches Verhalten. Abstraktion: Komplexität verstecken, nur Wesentliches zeigen.", "h": "Verstecken / Übernehmen / Viele Formen / Vereinfachen"}, {"q": "Was ist 'Composition over Inheritance' und warum wird es empfohlen?", "a": "Objekte besitzen andere Objekte (hat-ein) statt von ihnen zu erben (ist-ein). Flexibler: mehrere Verhaltensweisen kombinierbar, loser gekoppelt, leichter testbar. Vererbung für echte 'ist-ein' Beziehungen, Komposition für 'hat-ein'.", "h": "hat-ein bevorzugen vor ist-ein"}, {"q": "Was ist der Unterschied zwischen statischem und dynamischem Polymorphismus?", "a": "Statisch (Compile-Zeit): Method Overloading — welche Methode aufgerufen wird, entscheidet der Compiler anhand der Parameter. Dynamisch (Laufzeit): Method Overriding — welche Methode aufgerufen wird, entscheidet die JVM anhand des echten Objekttyps.", "h": "Compile-Zeit vs. Laufzeit-Entscheidung"}],
};

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightJava(code) {
  const esc = escHtml(code);
  const lines = esc.split('\n');
  const result = lines.map(line => {
    // Preserve leading whitespace
    const indent = line.match(/^(\s*)/)[1];
    let rest = line.slice(indent.length);

    // Full-line // comment
    if (rest.startsWith('//')) {
      return indent + `<span class="cm">${rest}</span>`;
    }
    // Full-line /* or * comment
    if (rest.startsWith('/*') || rest.startsWith('*') || rest.startsWith('*/')) {
      return indent + `<span class="cm">${rest}</span>`;
    }
    // Annotation
    if (rest.startsWith('@')) {
      const m = rest.match(/^(@\w+)(.*)/s);
      if (m) return indent + `<span class="an">${m[1]}</span>` + tokenize(m[2]);
    }
    return indent + tokenize(rest);
  });
  return result.join('\n');
}

function tokenize(s) {
  // tokenizer: strings, inline comments, keywords, types, numbers
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    // Inline // comment — rest of line
    if (s[i]==='/' && s[i+1]==='/') {
      tokens.push(`<span class="cm">${s.slice(i)}</span>`);
      break;
    }
    // String literal
    if (s[i] === '"') {
      let j = i+1;
      while (j < s.length && s[j] !== '"') { if (s[j]==='\\') j++; j++; }
      tokens.push(`<span class="st">${s.slice(i, j+1)}</span>`);
      i = j+1; continue;
    }
    // Char literal
    if (s[i] === "'") {
      let j = i+1;
      while (j < s.length && s[j] !== "'") { if (s[j]==='\\') j++; j++; }
      tokens.push(`<span class="st">${s.slice(i, j+1)}</span>`);
      i = j+1; continue;
    }
    // Word token
    if (/[a-zA-Z_$]/.test(s[i])) {
      let j = i;
      while (j < s.length && /[\w$]/.test(s[j])) j++;
      const word = s.slice(i, j);
      const keywords = new Set(['public','private','protected','static','final','abstract',
        'class','interface','enum','record','extends','implements','new','return','void',
        'if','else','for','while','do','switch','case','default','break','continue',
        'try','catch','finally','throw','throws','import','package','this','super',
        'true','false','null','instanceof','var','sealed','permits','yield','synchronized',
        'volatile','transient','native','strictfp','assert','const','goto']);
      const types = new Set(['int','long','double','float','boolean','char','byte','short',
        'String','Integer','Long','Double','Float','Boolean','Character','Byte','Short',
        'Object','List','ArrayList','Map','HashMap','Set','HashSet','Optional','Stream',
        'void','var','Scanner','System','Math','Arrays','Collections','StringBuilder']);
      if (keywords.has(word))    tokens.push(`<span class="kw">${word}</span>`);
      else if (types.has(word))  tokens.push(`<span class="ty">${word}</span>`);
      else if (/^[A-Z]/.test(word)) tokens.push(`<span class="ty">${word}</span>`);
      else {
        // method call?
        const after = s.slice(j).trimStart();
        if (after.startsWith('(')) tokens.push(`<span class="mt">${word}</span>`);
        else tokens.push(word);
      }
      i = j; continue;
    }
    // Number
    if (/\d/.test(s[i]) || (s[i]==='-' && /\d/.test(s[i+1]||''))) {
      let j = i; if(s[j]==='-') j++;
      while (j < s.length && /[\d._xXbBLlFfDd]/.test(s[j])) j++;
      tokens.push(`<span class="nm">${s.slice(i,j)}</span>`);
      i = j; continue;
    }
    tokens.push(s[i]);
    i++;
  }
  return tokens.join('');
}

let copyTimeout = null;
function copyCode(btn, code) {
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ Kopiert!';
    btn.style.color = '#3fb950';
    clearTimeout(copyTimeout);
    copyTimeout = setTimeout(() => { btn.textContent = 'Kopieren'; btn.style.color = ''; }, 2000);
  });
}

function formatResponse(text) {
  // handle ```java, ```bash, ``` (plain), plain ``` blocks
  const parts = text.split(/(```(?:java|bash|xml|sql|groovy|)[\s\S]*?```)/g);
  return parts.map(part => {
    const langMatch = part.match(/^```(java|bash|xml|sql|groovy|)\n?([\s\S]*?)```$/);
    if (langMatch) {
      const lang = langMatch[1] || 'code';
      const raw = langMatch[2];
      const highlighted = lang === 'java' ? highlightJava(raw) : `<span style="color:#e6edf3">${escHtml(raw)}</span>`;
      const label = lang === 'java' ? 'Java' : lang === 'bash' ? 'Terminal' : lang === 'xml' ? 'XML' : lang === 'sql' ? 'SQL' : lang === 'groovy' ? 'Groovy' : 'Code';
      const escaped = raw.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$');
      return `<div class="code-block">
  <div class="code-block-header">
    <span class="code-lang-badge">${label}</span>
    <button class="copy-btn" onclick="copyCode(this, \`${escaped}\`)">Kopieren</button>
  </div>
  <pre>${highlighted}</pre>
</div>`;
    }
    // Plain text sections — style section headers
    let t = escHtml(part);
    // Bold numbers like "1." "2." at start of line
    t = t.replace(/^(\d+\. .+)$/gm, '<span style="color:#e6edf3;font-weight:500">$1</span>');
    // inline code with backticks
    t = t.replace(/`([^`]+)`/g, '<code style="background:#21262d;padding:1px 5px;border-radius:4px;font-family:\'JetBrains Mono\',monospace;font-size:12px;color:#79c0ff">$1</code>');
    // 💡 Merksatz highlight
    t = t.replace(/(💡 Merksatz:.+)/g, '<span style="display:block;margin-top:12px;padding:10px 14px;background:rgba(248,152,32,0.08);border-left:3px solid #f89820;border-radius:0 6px 6px 0;color:#e6edf3">$1</span>');
    t = t.replace(/🏆 Best Practices:/g, '<span style="color:#3fb950;font-weight:500">🏆 Best Practices:</span>');
    t = t.replace(/(✓[^
]+)/g, '<span style="color:#3fb950">$1</span>');
    t = t.replace(/(✗[^
]+)/g, '<span style="color:#f85149">$1</span>');
    return `<span style="white-space:pre-wrap;line-height:1.8">${t}</span>`;
  }).join('');
}


const DONE_KEY = 'java_tutor_done';
const SR_KEY   = 'java_tutor_sr';

function lsGet(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || fallback); }
  catch(e) { return JSON.parse(fallback); }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

let done   = new Set(lsGet(DONE_KEY, '[]'));
let srData = lsGet(SR_KEY, '{}');
let activeId = null, currentItem = null, currentPhase = null;

function saveAll() {
  lsSet(DONE_KEY, [...done]);
  lsSet(SR_KEY, srData);
}

/* ── SPACED REPETITION ── */
function getSRInfo(id) {
  return srData[id] || { lastReview: null, interval: 1, ease: 2.5, reviews: 0 };
}
function daysSince(iso) {
  return Math.floor((Date.now() - new Date(iso)) / 86400000);
}
function isDueToday(id) {
  if (!done.has(id)) return false;
  const info = getSRInfo(id);
  if (!info.lastReview) return false;
  return daysSince(info.lastReview) >= info.interval;
}
function updateSR(id, rating) {
  const info = getSRInfo(id);
  let { interval, ease, reviews } = info;
  reviews = (reviews || 0) + 1;
  if (rating === 0)      { interval = 1; ease = Math.max(1.3, ease - 0.2); }
  else if (rating === 1) { interval = Math.max(1, Math.round(interval * 1.2)); ease = Math.max(1.3, ease - 0.05); }
  else                   { interval = reviews <= 1 ? 1 : reviews === 2 ? 3 : Math.min(90, Math.round(interval * ease)); ease = Math.min(3.0, ease + 0.1); }
  srData[id] = { lastReview: new Date().toISOString(), interval, ease, reviews };
  saveAll();
}

/* ── HELPERS ── */
function allTopics() {
  return roadmap.flatMap(p => p.items.map(i => ({ ...i, phase: p })));
}
function nextNewTopic() { return allTopics().find(t => !done.has(t.id)); }
function dueTopics()    { return allTopics().filter(t => isDueToday(t.id)); }

/* ── TABS ── */
function switchTab(tab) {
  document.getElementById('tab-heute').classList.toggle('active', tab === 'heute');
  document.getElementById('tab-lernen').classList.toggle('active', tab === 'lernen');
  document.getElementById('view-heute').style.display  = tab === 'heute'  ? 'block' : 'none';
  document.getElementById('view-lernen').style.display = tab === 'lernen' ? 'flex'  : 'none';
  if (tab === 'heute') renderHeuteView();
}

/* ── HEUTE VIEW ── */
function renderHeuteView() {
  const due = dueTopics(), nextNew = nextNewTopic();
  const todayLearned = Object.values(srData).some(d => d.lastReview && daysSince(d.lastReview) === 0);
  let h = '';
  h += `<div class="heute-stats">
    <div class="stat-card"><div class="stat-num">${done.size}</div><div class="stat-label">Erledigt</div></div>
    <div class="stat-card"><div class="stat-num">${due.length}</div><div class="stat-label">Review fällig</div></div>
    <div class="stat-card"><div class="stat-num">${allTopics().length - done.size}</div><div class="stat-label">Offen</div></div>
    <div class="stat-card"><div class="stat-num">${todayLearned ? '🔥' : '—'}</div><div class="stat-label">Heute gelernt</div></div>
  </div>`;
  h += `<div class="plan-box">
    <div class="plan-title">⏱ Dein 30-Minuten-Plan</div>
    <div class="plan-steps">
      <div class="plan-step${due.length === 0 ? ' skip' : ''}">
        <span class="plan-time">05 min</span>
        <span>${due.length > 0 ? due.length + ' Lektion' + (due.length > 1 ? 'en' : '') + ' wiederholen' : '✓ Keine Reviews fällig'}</span>
      </div>
      <div class="plan-step${!nextNew ? ' skip' : ''}">
        <span class="plan-time">15 min</span>
        <span>${nextNew ? 'Neue Lektion: <strong>' + escHtml(nextNew.name) + '</strong>' : '🎉 Alle Lektionen abgeschlossen!'}</span>
      </div>
      <div class="plan-step">
        <span class="plan-time">10 min</span>
        <span>Active Recall Quiz zur neuen Lektion</span>
      </div>
    </div>
  </div>`;
  if (due.length > 0) {
    h += `<div class="section-title">📚 Heute zu wiederholen (${due.length})</div><div class="topic-cards">`;
    due.forEach(t => {
      const info = getSRInfo(t.id);
      const ago  = info.lastReview ? daysSince(info.lastReview) + ' T. her' : '';
      h += `<div class="topic-card" onclick="openTopicFromHeute('${t.id}')">
        <div class="topic-card-name">${escHtml(t.name)}</div>
        <div class="topic-card-meta">${escHtml(t.phase.label)} · ${ago}</div>
        <button class="btn-quiz-small" onclick="event.stopPropagation();startQuiz('${t.id}')">🎯 Quiz starten</button>
      </div>`;
    });
    h += '</div>';
  }
  if (nextNew) {
    h += `<div class="section-title">🆕 Nächste Lektion</div>
    <div class="next-topic-card" onclick="openTopicFromHeute('${nextNew.id}')">
      <div class="ntc-phase">${escHtml(nextNew.phase.label)}</div>
      <div class="ntc-name">${escHtml(nextNew.name)}</div>
      <button class="btn primary" onclick="event.stopPropagation();openTopicFromHeute('${nextNew.id}')">Lektion öffnen →</button>
    </div>`;
  }
  const upcoming = allTopics().filter(t => {
    if (!done.has(t.id) || isDueToday(t.id)) return false;
    const info = getSRInfo(t.id);
    if (!info.lastReview) return false;
    return (info.interval - daysSince(info.lastReview)) <= 7;
  }).map(t => {
    const info = getSRInfo(t.id);
    return { ...t, daysLeft: info.interval - daysSince(info.lastReview) };
  }).sort((a, b) => a.daysLeft - b.daysLeft);
  if (upcoming.length > 0) {
    h += `<div class="section-title">📅 Kommende Reviews (7 Tage)</div><div class="upcoming-list">`;
    upcoming.forEach(t => {
      h += `<div class="upcoming-item">
        <span class="upcoming-name">${escHtml(t.name)}</span>
        <span class="upcoming-days">in ${t.daysLeft} Tag${t.daysLeft === 1 ? '' : 'en'}</span>
      </div>`;
    });
    h += '</div>';
  }
  document.getElementById('view-heute').innerHTML = h;
}

function openTopicFromHeute(id) {
  switchTab('lernen');
  const t = allTopics().find(x => x.id === id);
  if (t) selectTopic(t, t.phase);
}

/* ── PROGRESS ── */
function updateProgress() {
  const total = allTopics().length, n = done.size, due = dueTopics().length;
  const ptEl = document.getElementById('progress-text');
  const pfEl = document.getElementById('progress-fill');
  const bdEl = document.getElementById('due-badge');
  if (ptEl) ptEl.textContent = n + ' / ' + total;
  if (pfEl) pfEl.style.width = Math.round(n / total * 100) + '%';
  if (bdEl) { bdEl.textContent = due; bdEl.style.display = due > 0 ? 'inline-block' : 'none'; }
}

/* ── SIDEBAR ── */
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  if (!sb) return;
  sb.innerHTML = '';
  roadmap.forEach(phase => {
    const sec = document.createElement('div');
    sec.className = 'phase-section p' + phase.phase;
    sec.innerHTML = '<div class="phase-header"><span class="phase-badge">' + phase.phase + '</span>' + escHtml(phase.label) + '</div>';
    phase.items.forEach(item => {
      const isDue = isDueToday(item.id);
      const el = document.createElement('div');
      el.className = 'topic-item'
        + (done.has(item.id) ? ' done' : '')
        + (activeId === item.id ? ' active' : '')
        + (isDue ? ' due' : '');
      el.setAttribute('data-id', item.id);
      el.innerHTML = escHtml(item.name) + (isDue ? '<span class="due-dot" title="Review fällig">●</span>' : '');
      el.onclick = function() { switchTab('lernen'); selectTopic(item, phase); };
      sec.appendChild(el);
    });
    sb.appendChild(sec);
  });
}

/* ── TOPIC VIEW ── */
function selectTopic(item, phase) {
  activeId = item.id; currentItem = item; currentPhase = phase;
  renderSidebar();
  document.getElementById('welcome').style.display    = 'none';
  document.getElementById('quiz-view').style.display  = 'none';
  document.getElementById('topic-view').style.display = 'block';

  const tag = document.getElementById('topic-tag');
  tag.textContent = 'Phase ' + phase.phase + ' — ' + phase.label;
  tag.style.cssText = 'background:' + phase.color + '22;color:' + phase.color + ';border:1px solid ' + phase.color + '44';

  document.getElementById('topic-title').textContent = item.name;

  const doneBtn = document.getElementById('done-btn');
  doneBtn.textContent = done.has(item.id) ? '✓ Erledigt' : 'Als erledigt markieren';
  doneBtn.classList.toggle('marked', done.has(item.id));

  const bookRef = BOOK[item.id] || '';
  document.getElementById('book-ref').innerHTML = bookRef && bookRef !== 'extern'
    ? '📖 Java ist auch eine Insel — ' + bookRef
    : bookRef === 'extern' ? '📖 Thema nicht direkt im Buch' : '';

  const info = getSRInfo(item.id);
  const srEl = document.getElementById('sr-info');
  if (srEl) {
    if (done.has(item.id) && info.lastReview) {
      const next = info.interval - daysSince(info.lastReview);
      srEl.innerHTML = next <= 0 ? '🔁 Review heute fällig!' : '🔁 Nächster Review in ' + next + ' Tag' + (next === 1 ? '' : 'en');
      srEl.style.color = next <= 0 ? '#f89820' : '#7d8590';
    } else { srEl.innerHTML = ''; }
  }

  const box = document.getElementById('content-box');
  box.innerHTML = CONTENT[item.id] ? formatResponse(CONTENT[item.id]) : '<div class="error-box">Kein Inhalt gefunden.</div>';

  const qBtn = document.getElementById('quiz-btn');
  if (qBtn) qBtn.style.display = QUIZ[item.id] ? 'inline-flex' : 'none';
}

function toggleDone() {
  if (!currentItem) return;
  const id = currentItem.id;
  if (done.has(id)) { done.delete(id); }
  else {
    done.add(id);
    if (!srData[id]) srData[id] = { lastReview: new Date().toISOString(), interval: 1, ease: 2.5, reviews: 0 };
  }
  saveAll(); updateProgress(); renderSidebar();
  const doneBtn = document.getElementById('done-btn');
  doneBtn.textContent = done.has(id) ? '✓ Erledigt' : 'Als erledigt markieren';
  doneBtn.classList.toggle('marked', done.has(id));
  const info = getSRInfo(id);
  const srEl = document.getElementById('sr-info');
  if (srEl) {
    if (done.has(id) && info.lastReview) {
      const next = info.interval - daysSince(info.lastReview);
      srEl.innerHTML = next <= 0 ? '🔁 Review heute fällig!' : '🔁 Nächster Review in ' + next + ' Tag' + (next === 1 ? '' : 'en');
    } else { srEl.innerHTML = ''; }
  }
}

function askFollowUp() {
  if (!currentItem) return;
  const msg = 'Gib mir eine Übungsaufgabe zum Thema "' + currentItem.name + '" in Java. Ich bin Azubi im ersten Lehrjahr.';
  if (window.parent !== window) window.parent.postMessage({ type: 'sendPrompt', text: msg }, '*');
  else { navigator.clipboard.writeText(msg).catch(() => {}); alert('Frage in Zwischenablage kopiert:\n\n' + msg); }
}
function askDeeper() {
  if (!currentItem) return;
  const msg = 'Erkläre "' + currentItem.name + '" in Java detaillierter mit einem fortgeschritteneren Beispiel.';
  if (window.parent !== window) window.parent.postMessage({ type: 'sendPrompt', text: msg }, '*');
  else { navigator.clipboard.writeText(msg).catch(() => {}); alert('Frage in Zwischenablage kopiert:\n\n' + msg); }
}

/* ── QUIZ ── */
let quizState = { id: null, questions: [], idx: 0, results: [] };

function startQuiz(id) {
  const t = id ? allTopics().find(x => x.id === id) : currentItem;
  if (!t || !QUIZ[t.id]) return;
  activeId = t.id; currentItem = t;
  quizState = { id: t.id, questions: QUIZ[t.id], idx: 0, results: [] };
  document.getElementById('topic-view').style.display = 'none';
  document.getElementById('welcome').style.display    = 'none';
  const qv = document.getElementById('quiz-view');
  qv.style.display = 'block'; qv.scrollTop = 0;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const { questions, idx } = quizState, q = questions[idx], total = questions.length;
  document.getElementById('quiz-view').innerHTML = '<div class="quiz-header">'
    + '<button class="btn" onclick="closeQuiz()" style="font-size:12px;padding:4px 10px">✕ Schließen</button>'
    + '<div class="quiz-progress-text">Frage ' + (idx+1) + ' / ' + total + ' — ' + escHtml(currentItem.name) + '</div>'
    + '<div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:' + (idx/total*100) + '%"></div></div>'
    + '</div>'
    + '<div class="quiz-card">'
    + '<div class="quiz-q">' + escHtml(q.q) + '</div>'
    + '<div class="quiz-hint">💡 Hinweis: ' + escHtml(q.h) + '</div>'
    + '<textarea class="quiz-answer" id="quiz-input" placeholder="Schreibe deine Antwort..." rows="4"></textarea>'
    + '<button class="btn primary" onclick="showAnswer()" style="width:100%;margin-top:10px">Antwort anzeigen →</button>'
    + '</div>';
  const inp = document.getElementById('quiz-input');
  if (inp) inp.focus();
}

function showAnswer() {
  const q = quizState.questions[quizState.idx];
  const userAns = (document.getElementById('quiz-input') || {}).value || '';
  document.querySelector('.quiz-card').innerHTML =
    '<div class="quiz-q">' + escHtml(q.q) + '</div>'
    + (userAns ? '<div class="quiz-user-answer"><strong>Deine Antwort:</strong><br>' + escHtml(userAns) + '</div>' : '')
    + '<div class="quiz-model-answer"><strong>✓ Musterlösung:</strong><br>' + escHtml(q.a) + '</div>'
    + '<div class="quiz-rating-label">Wie gut wusstest du das?</div>'
    + '<div class="quiz-rating">'
    + '<button class="rating-btn red"    onclick="rateAnswer(0)">❌ Nicht gewusst</button>'
    + '<button class="rating-btn yellow" onclick="rateAnswer(1)">⚡ Fast</button>'
    + '<button class="rating-btn green"  onclick="rateAnswer(2)">✅ Gewusst</button>'
    + '</div>';
}

function rateAnswer(rating) {
  quizState.results.push(rating);
  quizState.idx++;
  if (quizState.idx >= quizState.questions.length) showQuizResult();
  else renderQuizQuestion();
}

function showQuizResult() {
  const { results, id } = quizState;
  const g = results.filter(r => r === 2).length;
  const f = results.filter(r => r === 1).length;
  const n = results.filter(r => r === 0).length;
  const score = Math.round((g * 100 + f * 50) / results.length);
  const avg = results.reduce((a,b) => a+b, 0) / results.length;
  updateSR(id, avg >= 1.5 ? 2 : avg >= 0.7 ? 1 : 0);
  if (!done.has(id)) { done.add(id); saveAll(); }
  const nextInterval = getSRInfo(id).interval;
  document.getElementById('quiz-view').innerHTML =
    '<div class="quiz-result">'
    + '<div class="qr-score ' + (score >= 70 ? 'good' : score >= 40 ? 'ok' : 'bad') + '">' + score + '%</div>'
    + '<div class="qr-title">' + (score >= 70 ? '🎉 Gut gemacht!' : score >= 40 ? '💪 Weiter üben!' : '📚 Nochmal lesen!') + '</div>'
    + '<div class="qr-breakdown"><span class="qr-green">✅ ' + g + ' gewusst</span><span class="qr-yellow">⚡ ' + f + ' fast</span><span class="qr-red">❌ ' + n + ' nicht gewusst</span></div>'
    + '<div class="qr-sr">🔁 Nächster Review in <strong>' + nextInterval + ' Tag' + (nextInterval === 1 ? '' : 'en') + '</strong></div>'
    + '<div class="qr-actions">'
    + '<button class="btn primary" onclick="closeQuiz()">Zurück zur Lektion</button>'
    + '<button class="btn" onclick="startQuiz(\'' + id + '\')">Wiederholen</button>'
    + '</div></div>';
  updateProgress(); renderSidebar();
}

function closeQuiz() {
  document.getElementById('quiz-view').style.display = 'none';
  if (currentItem) document.getElementById('topic-view').style.display = 'block';
  else document.getElementById('welcome').style.display = 'flex';
}

renderSidebar();
updateProgress();
</script>
</body>
